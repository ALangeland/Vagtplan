<!DOCTYPE html>
<html lang="da"><head><script>try{var t=localStorage.getItem("vp_theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin – Vagtløn</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#dde2ea;--acc:#0b6e8a;--bad:#c8352f;--ok:#1f8a5b;--b2:#f09a2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--ink:#e8edf5;--mut:#9aa6b8;--line:#2a3547;--acc:#4fb4d0;--bad:#ff7b72;--ok:#4cc38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#18202e;--ink:#e8edf5;--mut:#9aa6b8;--line:#2a3547;--acc:#4fb4d0;--bad:#ff7b72;--ok:#4cc38a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center}header b{font-size:18px}header a{color:#bfe9f6;margin-left:auto;font-size:14px}
main{max-width:1150px;margin:0 auto;padding:18px 14px 50px}h2{font-size:18px;margin:26px 0 10px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k div,.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.k small{display:block;color:var(--mut);font-size:12px;font-weight:600}.k b{font-size:26px;letter-spacing:-.02em}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px}button{cursor:pointer}button.d{color:var(--bad)}
.note{color:var(--mut);font-size:13px}svg text{fill:var(--mut);font-size:10px}.bar{display:flex;align-items:center;gap:8px;margin:3px 0}.bar i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.msg{max-width:520px;margin:12vh auto;text-align:center}.msg a{color:var(--acc)}
header{padding:8px 16px}header b{font-size:16px}header a{font-size:13px}
main{padding:10px 12px 30px}h2{font-size:15px;margin:14px 0 6px}
.k{gap:6px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.k div,.c{padding:7px 10px;border-radius:8px}.k div small{font-size:11px}.k div b{font-size:18px}
.g2{gap:8px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.bar{margin:1px 0}td,th{padding:3px 6px;font-size:13px}
.ctxsw{display:flex;margin-left:auto;background:rgba(255,255,255,.12);border-radius:8px;padding:2px}.ctxsw a,.ctxsw span{margin:0!important;font-size:12px;padding:4px 10px;border-radius:6px;color:#fff;text-decoration:none}.ctxsw span{background:#fff;color:#14213d}
.at{display:flex;gap:4px;margin-left:14px;overflow-x:auto}.at a{color:#cfe3f3;padding:6px 11px;border-radius:7px;font-size:13px;text-decoration:none;margin:0!important}.at a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
header{background:#14213d;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 10px rgba(0,0,0,.14);padding:0 12px;gap:2px;align-items:stretch;position:sticky;top:0;z-index:5;overflow-x:auto}
header .brand{display:flex;flex-direction:column;justify-content:center;padding:6px 14px 6px 4px;line-height:1.1;flex:none}header .brand b{font-size:16px;font-weight:800;letter-spacing:-.02em;color:#fff}header .brand i{font-style:normal;font-size:10.5px;color:#8fa0bb}
header .at{display:flex;margin:0;gap:2px;overflow:visible}header .at a{color:#aab6c8;padding:14px 12px;font:600 14px inherit;font-family:inherit;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap}header .at a.on{color:#fff;border-color:#5fd0ef;background:none}
header .ctxsw{display:flex;margin:auto 0 auto auto;background:rgba(255,255,255,.12);border-radius:8px;padding:2px;flex:none}header .ctxsw a,header .ctxsw span{font-size:12px;padding:5px 10px;border-radius:6px;color:#fff;opacity:.75;text-decoration:none}header .ctxsw span{background:#fff;color:#14213d;opacity:1;font-weight:600}
</style></head><body>
<header><span class="brand"><b>Vagtløn</b><i>beta · admin</i></span><nav class="at"><a class="on" href="admin.html">Statistik</a><a href="app.html?embed=1#postkasse">Postkasse</a><a href="app.html?embed=1#okadm">OK-overblik</a><a href="app.html?embed=1#admdata">Data og import</a></nav><span class="ctxsw"><a href="app.html">Bruger</a><span>Admin</span></span></header><main id="m"><p class="note">Henter ...</p></main>
<script>
const $=document.querySelector.bind(document),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]),nf=n=>Number(n||0).toLocaleString('da-DK');
async function api(a,body){const r=await fetch('api/?a='+a,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Requested-With':'vagtplan'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}j._status=r.status;return j}
const OK={dk:'Danmark',fo:'Færøerne',gl:'Grønland',own:'Egen aftale',stud:'Studenterjob og vikar'},dt=t=>t?new Date(t*1000).toLocaleString('da-DK',{dateStyle:'short',timeStyle:'short'}):'–',ago=(t,now)=>{if(!t)return'aldrig';const d=now-t;return d<3600?Math.max(1,Math.round(d/60))+' min siden':d<86400?Math.round(d/3600)+' t siden':Math.round(d/86400)+' d siden'};
function bars(vals,labels,color,h=90){const w=Math.max(...vals,1),n=vals.length,bw=Math.floor(540/n);return`<svg viewBox="0 0 560 ${h+24}" width="100%" role="img">${vals.map((v,i)=>`<rect x="${10+i*bw}" y="${h-v/w*h}" width="${bw-3}" height="${v/w*h}" rx="2" fill="${color}"><title>${esc(labels[i])}: ${v}</title></rect>`).join('')}<text x="10" y="${h+14}">${esc(labels[0].slice(5))}</text><text x="550" y="${h+14}" text-anchor="end">${esc(labels[n-1].slice(5))}</text><text x="550" y="10" text-anchor="end">maks ${w}</text></svg>`}
function list(o,map){const e=Object.entries(o||{}),mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div class="bar"><span style="min-width:130px">${esc(map?map(k):k)}</span><i style="width:${v/mx*55}%"></i><b>${nf(v)}</b></div>`).join(''):'<p class="note">Ingen data endnu.</p>'}
let D=null,Q='';
function view(){const t=D.totals,a=D.agg,v=D.visits,sum=k=>v.reduce((x,y)=>x+y[k],0),us=D.users.filter(u=>u.email.toLowerCase().includes(Q.toLowerCase())),avg=t.users?Math.round(a.plan/t.users):0;
 $('#m').innerHTML=`<div class="k"><div><small>Brugere i alt</small><b>${nf(t.users)}</b></div><div><small>Nye, 7 dage</small><b>${nf(t.new7)}</b></div><div><small>Nye, 30 dage</small><b>${nf(t.new30)}</b></div><div><small>Aktive, 24 timer</small><b>${nf(t.dau)}</b></div><div><small>Aktive, 7 dage</small><b>${nf(t.wau)}</b></div><div><small>Aktive, 30 dage</small><b>${nf(t.mau)}</b></div><div><small>Med ansættelse</small><b>${nf(a.withEmps)}</b></div><div><small>Med planlagte vagter</small><b>${nf(a.withPlan)}</b></div></div>
 <h2>Besøg, seneste 30 dage</h2><div class="g2"><div class="c"><b>Forside: unikke besøgende pr. dag</b> <span class="note">(${nf(sum('landing_uv'))} dagsbesøg, ${nf(sum('landing_pv'))} visninger)</span>${bars(v.map(x=>x.landing_uv),D.days,'#0b6e8a')}</div><div class="c"><b>App: unikke besøgende pr. dag</b> <span class="note">(${nf(sum('app_uv'))} dagsbesøg, ${nf(sum('app_pv'))} visninger)</span>${bars(v.map(x=>x.app_uv),D.days,'#1f8a5b')}</div><div class="c"><b>Nye brugere pr. dag</b>${bars(D.signups,D.days,'#f09a2a')}</div><div class="c"><b>Hvor kommer besøgende fra</b><div style="margin-top:6px">${list(Object.fromEntries(D.refs.map(r=>[r.host,+r.n])))}</div><p class="note">Kun besøg fra andre sites. Direkte besøg er ikke med.</p></div></div>
 <h2>Data</h2><div class="k"><div><small>Ansættelser</small><b>${nf(a.emps)}</b></div><div><small>Planlagte vagter</small><b>${nf(a.plan)}</b></div><div><small>Gns. vagter pr. bruger</small><b>${nf(avg)}</b></div><div><small>Vagtformer</small><b>${nf(a.forms)}</b></div><div><small>Evakueringer</small><b>${nf(a.evacs)}</b></div><div><small>Tillægsflag</small><b>${nf(a.flags)}</b></div><div><small>Vikaransættelser</small><b>${nf(a.kind.vikar)}</b></div><div><small>Lagring</small><b>${(a.bytes/1048576).toFixed(2).replace('.',',')} MB</b></div><div><small>Ubekræftede konti</small><b>${nf(t.unverified)}</b></div><div><small>Delte normperioder</small><b>${nf(t.normshare)}</b></div><div><small>Delte vagtformer</small><b>${nf(t.shiftshare)}</b></div></div>
 <div class="g2" style="margin-top:12px"><div class="c"><b>Ansættelser pr. overenskomst</b><div style="margin-top:6px">${list(a.ok,k=>OK[k]||k)}</div></div><div class="c"><b>Pr. region</b><div style="margin-top:6px">${list(a.region)}</div></div><div class="c"><b>Mest brugte stillinger</b><div style="margin-top:6px">${list(a.pos,k=>{const[o,p]=k.split(':');return(OK[o]||o)+' · '+p})}</div></div><div class="c"><b>Afdelinger (brugere)</b><div style="margin-top:6px">${list(a.deps)}</div></div></div>
 <h2>Delte vagtformer</h2><div id="sh"></div><h2>Brugere</h2><p class="note">Du ser kun e-mail og tal, aldrig indholdet af brugernes vagtplaner.</p><p><input placeholder="Søg e-mail" value="${esc(Q)}" oninput="Q=this.value;users()"></p><div class="c" style="overflow-x:auto" id="u"></div>`;users()}
function users(){const now=D.now,us=D.users.filter(u=>u.email.toLowerCase().includes(Q.toLowerCase())).slice(0,300);$('#u').innerHTML=`<table><tr><th>E-mail</th><th>Oprettet</th><th>Sidst aktiv</th><th class="n">Ansæt.</th><th class="n">Vagter</th><th class="n">Former</th><th class="n">Evak.</th><th class="n">KB</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.email)}${u.verified?'':' <small style="color:var(--bad)">ikke bekræftet</small>'}</td><td>${dt(u.created)}</td><td>${ago(u.last_seen,now)}</td><td class="n">${u.emps}</td><td class="n">${u.plan}</td><td class="n">${u.forms}</td><td class="n">${u.evacs}</td><td class="n">${(u.bytes/1024).toFixed(1).replace('.',',')}</td><td style="white-space:nowrap">${u.verified?'':`<button onclick="ver(${u.id})">Bekræft</button> `}<button class="d" onclick="del(${u.id},'${esc(u.email).replace(/'/g,'')}')">Slet</button></td></tr>`).join('')||'<tr><td colspan="9">Ingen brugere.</td></tr>'}</table>`}
let SH=null,SHQ='';
async function shLoad(){const r=await api('admin_shares');SH=r.items||[];shView()}
function shView(){const el=$('#sh');if(!el)return;if(!SH){el.innerHTML='<button onclick="shLoad()">Vis delte vagtformer</button>';return}
 const q=SHQ.toLowerCase(),rows=SH.map(x=>{let o={};try{o=JSON.parse(x.j)}catch(e){}return{x,o}}).filter(({x,o})=>(x.dk+' '+(o.name||o.n||'')).toLowerCase().includes(q));
 el.innerHTML='<p><input placeholder="Søg afdeling eller navn" value="'+esc(SHQ)+'" oninput="SHQ=this.value;shView()"> <span class="note">'+rows.length+' af '+SH.length+'</span></p><table><tr><th>Afdeling</th><th>Vagtform</th><th>Tider</th><th class="n">Delt af</th><th></th></tr>'+rows.map(({x,o})=>{const t=(o.b||o.byDay)?'varierer':((o.t&&o.t[0]&&o.t[0][0])?o.t[0][0]+'–'+o.t[0][1]:'');return'<tr><td>'+esc(x.dk)+'</td><td>'+esc(o.name||o.n||o.ab||'?')+'</td><td>'+esc(t)+'</td><td class="n">'+x.n+'</td><td><button class="d" onclick="shDel([\''+x.id+'\'])">Slet</button></td></tr>'}).join('')+'</table>'+(q&&rows.length?'<p><button class="d" onclick="shDel(['+rows.map(r=>"'"+r.x.id+"'").join(',')+'])">Slet alle '+rows.length+' viste</button></p>':'')}
async function shDel(ids){if(!confirm('Slet '+ids.length+' delt vagtform'+(ids.length>1?'er':'')+' for alle brugere? Brugernes egne vagtformer berøres ikke.'))return;const r=await api('admin_share_del',{ids});if(r.ok){SH=SH.filter(x=>!ids.includes(x.id));shView()}else alert(r.error||'Noget gik galt.')}
async function ver(id){const r=await api('admin_verify',{id});if(r.ok)load();else alert(r.error||'Noget gik galt.')}
async function del(id,e){if(!confirm('Slet brugeren '+e+' og alle brugerens data permanent?'))return;const r=await api('admin_delete',{id});if(r.ok)load();else alert(r.error||'Noget gik galt.')}
async function load(){const me=await api('me');if(me._status!==200){$('#m').innerHTML='<div class="msg"><h2>Serveren svarer ikke</h2><p class="note">Tjek at api/ er uploadet, og at config.php findes.</p></div>';return}
 if(!me.user){$('#m').innerHTML='<div class="msg"><h2>Log ind først</h2><p>Log ind i <a href="app.html">appen</a> med en administratorkonto, og kom tilbage hertil.</p></div>';return}
 if(!me.admin){$('#m').innerHTML='<div class="msg"><h2>Ingen adgang</h2><p class="note">Kontoen er ikke angivet som administrator i config.php.</p></div>';return}
 D=await api('admin_stats');if(D.error){$('#m').innerHTML='<div class="msg"><h2>'+esc(D.error)+'</h2></div>';return}view();shView()}
load();
</script></body></html>
