function bars(vals,labels,color,h=90){const w=Math.max(...vals,1),n=vals.length,bw=Math.floor(540/n);return`<svg viewBox="0 0 560 ${h+24}" width="100%" role="img">${vals.map((v,i)=>`<rect x="${10+i*bw}" y="${h-v/w*h}" width="${bw-3}" height="${v/w*h}" rx="2" fill="${color}"><title>${esc(labels[i])}: ${v}</title></rect>`).join('')}<text x="10" y="${h+14}">${esc(labels[0].slice(5))}</text><text x="550" y="${h+14}" text-anchor="end">${esc(labels[n-1].slice(5))}</text><text x="550" y="10" text-anchor="end">maks ${w}</text></svg>`}
function list(o,map){const e=Object.entries(o||{}),mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div class="bar"><span style="min-width:130px">${esc(map?map(k):k)}</span><i style="width:${v/mx*55}%"></i><b>${nf(v)}</b></div>`).join(''):'<p class="note">Ingen data endnu.</p>'}
let D=null,Q='';
let DEMO=0,DOK='',NT=null;
function ntBar(){const on=NT&&NT.on;return'<div class="c" style="margin-bottom:10px"><label style="display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer"><input type="checkbox" '+(on?'checked ':'')+(DEMO||!NT||NT.error?'disabled ':'')+'onchange="ntSet(this.checked)" style="width:18px;height:18px"> Send mig en mail, når en ny bruger opretter sig</label><p class="note" style="margin:6px 0 0 28px">'+(DEMO?"Kan prøves i den rigtige udgave på vagtloen.dk.":NT&&NT.to?'Mailen sendes til '+esc(NT.to)+'. Den indeholder den nye brugers e-mail og antallet af brugere.':'Kunne ikke hente indstillingen.')+'</p></div>'}
async function ntSet(on){const r=await api('admin_notify',{on});if(r&&r.ok)NT={on:r.on,to:NT&&NT.to};else alert((r&&r.error)||'Noget gik galt.');view()}
function mkDemo(){const ks=Object.keys(MT.pos).filter(k=>!DOK||k.startsWith(DOK+':')),R=['Hovedstaden','Sjælland','Syddanmark','Midtjylland','Nordjylland','Grønland','Færøerne'],dep=['Medicinsk afdeling','Akutmodtagelsen','Kirurgisk afdeling','Anæstesi','Børneafdelingen','Psykiatrien','Dronning Ingrids Hospital','Landssygehuset'];
 const agg={ok:{},region:{},pos:{},kind:{fast:0,vikar:0},emps:0,plan:0,forms:0,evacs:0,flags:0,withEmps:0,withPlan:0,bytes:0,deps:{}},users=[];
 ks.forEach((k,i)=>{const n=1+(i*7)%9,o=k.split(':')[0];agg.pos[k]=n;agg.ok[o]=(agg.ok[o]||0)+n;agg.emps+=n;const rg=R[i%R.length];agg.region[rg]=(agg.region[rg]||0)+n;const d=dep[i%dep.length];agg.deps[d]=(agg.deps[d]||0)+1;agg.kind[i%6?'fast':'vikar']+=n;
  users.push({id:i+1,verified:1,email:'eksempel'+(i+1)+'@'+o+'.test',created:D0-86400*(i%40),last_seen:D0-3600*(i%90),emps:1,plan:20+(i*13)%160,forms:3+i%5,evacs:o==='gl'?i%4:0,bytes:20000+i*1700,updated:D0})});
 agg.plan=users.reduce((x,u)=>x+u.plan,0);agg.forms=users.reduce((x,u)=>x+u.forms,0);agg.bytes=users.reduce((x,u)=>x+u.bytes,0);agg.withEmps=agg.withPlan=users.length;agg.evacs=users.reduce((x,u)=>x+u.evacs,0);agg.flags=users.length*2;
 const days=[],visits=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push(d.toISOString().slice(5,10));visits.push({landing_uv:30+(i*5)%25,landing_pv:50+(i*7)%40,app_uv:10+(i*3)%14,app_pv:30+(i*9)%30})}
 const sorted=Object.fromEntries(Object.entries(agg.pos).sort((a,b)=>b[1]-a[1]).slice(0,12));agg.pos=sorted;
 return{totals:{users:users.length,new7:5,new30:users.length,dau:4,wau:12,mau:users.length,unverified:0,normshare:3,shiftshare:7},agg,visits,days,signups:days.map((x,i)=>i%4?0:1),refs:[{host:'eksempel.dk',n:12}],users,now:D0}}
const D0=Math.floor(Date.now()/1000);
function demoBar(){return'<div class="c" style="margin-bottom:10px;border:2px dashed #e0a030"><b>Eksempeldata</b> (ikke rigtige brugere). Vælg overenskomst: <select onchange="DOK=this.value;D=mkDemo();view()"><option value="">Alle</option>'+Object.keys(MT.ok).map(k=>'<option value="'+k+'"'+(k===DOK?' selected':'')+'>'+esc(MT.ok[k])+'</option>').join('')+'</select> <a href="app.html">Se eksempler i brugerkonteksten</a> (vælg «Faggruppe» i topbjælken)</div>'}

function view(){const t=D.totals,a=D.agg,v=D.visits,sum=k=>v.reduce((x,y)=>x+y[k],0),us=D.users.filter(u=>u.email.toLowerCase().includes(Q.toLowerCase())),avg=t.users?Math.round(a.plan/t.users):0;
 const T=(rows)=>'<table>'+rows.map(([k,v])=>`<tr><td>${k}</td><td class="n"><b>${v}</b></td></tr>`).join('')+'</table>',
 L=(t,o,map)=>{const e=Object.entries(o||{});return e.length?`<div class="c t h4"><h3>${t}</h3><table>${e.map(([k,n])=>`<tr><td>${esc(map?map(k):k)}</td><td class="n"><b>${nf(n)}</b></td></tr>`).join('')}</table></div>`:''},
 sp=(arr,lab,col)=>bars(arr,lab,col,46);
 $('#m').innerHTML=(DEMO?demoBar():'')+ntBar()+`<h2 class="sh h1">Statistik</h2><div class="g3"><div class="c t h1"><h3>Brugere</h3>${T([['I alt',nf(t.users)],['Nye, 7 / 30 dage',nf(t.new7)+' / '+nf(t.new30)],['Aktive, 24 t / 7 d / 30 d',nf(t.dau)+' / '+nf(t.wau)+' / '+nf(t.mau)],['Med ansættelse',nf(a.withEmps)],['Med planlagte vagter',nf(a.withPlan)],['Ubekræftede',nf(t.unverified)]])}</div><div class="c t h2"><h3>Data</h3>${T([['Ansættelser (heraf vikar)',nf(a.emps)+' ('+nf(a.kind.vikar)+')'],['Planlagte vagter (gns. pr. bruger)',nf(a.plan)+' ('+nf(avg)+')'],['Vagtformer',nf(a.forms)],['Evakueringer / tillægsflag',nf(a.evacs)+' / '+nf(a.flags)],['Delte normperioder / vagtformer',nf(t.normshare)+' / '+nf(t.shiftshare)],['Lagring',(a.bytes/1048576).toFixed(2).replace('.',',')+' MB']])}</div><div class="c t h3"><h3>Besøg, 30 dage</h3>${T([['Forside: dagsbesøg / visninger',nf(sum('landing_uv'))+' / '+nf(sum('landing_pv'))],['App: dagsbesøg / visninger',nf(sum('app_uv'))+' / '+nf(sum('app_pv'))],['Nye brugere',nf(D.signups.reduce((x,y)=>x+y,0))]])}<div style="margin-top:6px">${sp(v.map(x=>x.app_uv),D.days,'#1f8a5b')}</div></div></div>
 <h2 class="sh h4">Fordeling</h2><div class="g3">${L('Ansættelser pr. overenskomst',a.ok,okn)}${L('Pr. region',a.region)}${L('Mest brugte stillinger',a.pos,k=>{const[o,p]=k.split(':');return okn(o)+' · '+(MT.pos[k]||p)})}${L('Afdelinger (brugere)',a.deps)}${D.refs.length?L('Henvisninger (andre sites)',Object.fromEntries(D.refs.map(r=>[r.host,+r.n]))):''}</div>
 <h2 class="sh h2">Delte vagtformer</h2><div id="sh"></div><h2 class="sh h3">Brugere <small>klik på en kolonne for at sortere</small></h2><p class="note">Du ser kun e-mail og tal, aldrig indholdet af brugernes vagtplaner.</p><p><input placeholder="Søg e-mail" value="${esc(Q)}" oninput="Q=this.value;users()"></p><div class="c" style="overflow-x:auto" id="u"></div>`;users()}
let SK='created',SD=-1;
const COLS=[['email','E-mail'],['created','Oprettet'],['last_seen','Sidst aktiv'],['emps','Ansæt.',1],['plan','Vagter',1],['forms','Former',1],['evacs','Evak.',1],['bytes','KB',1],['tro','Trofæ'],['pal','Temaer']];
function srt(k){if(SK===k)SD=-SD;else{SK=k;SD=(k==='email')?1:-1}users()}
function sval(u,k){return k==='email'?u.email.toLowerCase():k==='tro'?(u.trophies||[]).length:k==='pal'?(u.pals||[]).length:(+u[k]||0)}
function users(){const now=D.now,us=D.users.filter(u=>u.email.toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>{const x=sval(a,SK),y=sval(b,SK);return(x<y?-1:x>y?1:0)*SD||a.email.localeCompare(b.email)}).slice(0,300);
 $('#u').innerHTML=`<table><tr>${COLS.map(([k,l,n])=>`<th class="s${n?' n':''}${SK===k?' on':''}" onclick="srt('${k}')">${l}${SK===k?(SD>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr>${us.map(u=>`<tr><td>${esc(u.email)}${u.verified?'':' <small style="color:var(--bad)">ikke bekræftet</small>'}</td><td>${dt(u.created)}</td><td>${ago(u.last_seen,now)}</td><td class="n">${u.emps}</td><td class="n">${u.plan}</td><td class="n">${u.forms}</td><td class="n">${u.evacs}</td><td class="n">${(u.bytes/1024).toFixed(1).replace('.',',')}</td><td><div class="tc">${(u.trophies||[]).map(t=>`<span class="tr" title="${esc((TRK[t.kind]||TRK.pokal).n+(t.note?': '+t.note:''))}">${trkSvg(t.kind,18)}<span>${esc((t.note||(TRK[t.kind]||TRK.pokal).n).slice(0,28))}</span><button title="Fjern trofæ" onclick="trAsk(${u.id},${t.id})">×</button></span>`).join('')}${TO===u.id?`<span class="tf tfk"><span class="kp">${Object.keys(TRK).map(k=>`<button type="button" class="${TK===k?'on':''}" title="${esc(TRK[k].n)}" onclick="TK='${k}';users();setTimeout(()=>{const e=$('#tn${u.id}');e&&e.focus()},0)">${trkSvg(k,26)}</button>`).join('')}</span><input id="tn${u.id}" placeholder="Note (valgfri)" maxlength="300" onkeydown="if(event.key==='Enter')trophy(${u.id});if(event.key==='Escape'){TO=0;users()}"><button onclick="trophy(${u.id})">Giv</button></span>`:`<button class="tp" onclick="TO=${u.id};users();setTimeout(()=>{const e=$('#tn${u.id}');e&&e.focus()},0)">＋ trofæ</button>`}</div></td><td><div class="tc">${(u.pals||[]).map(pk=>`<span class="tr th" title="Tema givet af admin"><i style="background:${esc(((PAL[pk]||{}).l||[])[0]||'#888')}"></i><span>${esc((PAL[pk]||{n:pk}).n)}</span><button title="Fjern tema" onclick="palSet(${u.id},'${pk}',1)">×</button></span>`).join('')}${PO===u.id?`<select id="pp${u.id}" onchange="if(this.value){palSet(${u.id},this.value)}"><option value="">Vælg tema …</option>${Object.keys(PAL).filter(k=>!(u.pals||[]).includes(k)).map(k=>`<option value="${k}">${esc(PAL[k].n)}</option>`).join('')}</select>`:`<button class="tp" onclick="PO=${u.id};users()">＋ tema</button>`}</div></td><td style="white-space:nowrap">${u.verified?'':`<button onclick="ver(${u.id})">Bekræft</button> `}<button class="d" onclick="delAsk(${u.id})">Slet</button></td></tr>`).join('')||'<tr><td colspan="11">Ingen brugere.</td></tr>'}</table>`}
let TO=0,TK='baekken',PO=0;
async function palSet(id,pal,del){const u=D.users.find(x=>x.id===id);if(!DEMO){const r=await api('admin_pal',{id,pal,del:del?1:0});if(!r.ok){alert(r.error||'Noget gik galt.');return}}u.pals=(u.pals||[]).filter(x=>x!==pal);if(!del)u.pals.push(pal);PO=0;users()}
function cfm(h,go,word){return new Promise(res=>{const d=document.createElement('div');d.id='cf';d.innerHTML='<div role="alertdialog" aria-modal="true">'+h+(word?'<p class="note">Skriv <b>'+esc(word)+'</b> for at bekræfte:</p><input id="cfw" autocomplete="off">':'')+'<div class="bt"><button id="cfn">Annuller</button><button class="go" id="cfy"'+(word?' disabled':'')+'>'+esc(go)+'</button></div></div>';document.body.appendChild(d);const done=v=>{d.remove();res(v)};$('#cfn').onclick=()=>done(false);$('#cfy').onclick=()=>done(true);d.onclick=e=>{if(e.target===d)done(false)};if(word){const w=$('#cfw');w.oninput=()=>{$('#cfy').disabled=w.value.trim().toLowerCase()!==word.toLowerCase()};w.focus()}else $('#cfn').focus();d.onkeydown=e=>{if(e.key==='Escape')done(false)}})}
async function trAsk(uid,tid){const u=D.users.find(x=>x.id===uid),t=u&&(u.trophies||[]).find(x=>x.id===tid);if(!t)return;if(await cfm('<h3>Fjern trofæ?</h3><p>Trofæet <b>'+esc((TRK[t.kind]||TRK.pokal).n+(t.note?' – '+t.note:''))+'</b> fjernes fra <code>'+esc(u.email)+'</code>.</p>','Fjern trofæ'))trophy(uid,tid)}
async function delAsk(id){const u=D.users.find(x=>x.id===id);if(!u)return;if(await cfm('<h3>Slet bruger permanent?</h3><p><code>'+esc(u.email)+'</code></p><p>Brugerens konto og <b>alle data</b> ('+u.emps+' ansættelser, '+u.plan+' vagter, '+u.forms+' vagtformer) slettes for altid. Det kan ikke fortrydes.</p>','Slet for altid',u.email.split('@')[0]))del(id,u.email,1)}
let SH=null,SHQ='';
async function shLoad(){const r=await api('admin_shares');SH=r.items||[];shView()}
function shView(){const el=$('#sh');if(!el)return;if(!SH){el.innerHTML='<button onclick="shLoad()">Vis delte vagtformer</button>';return}
 const q=SHQ.toLowerCase(),rows=SH.map(x=>{let o={};try{o=JSON.parse(x.j)}catch(e){}return{x,o}}).filter(({x,o})=>(x.dk+' '+(o.name||o.n||'')).toLowerCase().includes(q));
 el.innerHTML='<p><input placeholder="Søg afdeling eller navn" value="'+esc(SHQ)+'" oninput="SHQ=this.value;shView()"> <span class="note">'+rows.length+' af '+SH.length+'</span></p><table><tr><th>Afdeling</th><th>Vagtform</th><th>Tider</th><th class="n">Delt af</th><th></th></tr>'+rows.map(({x,o})=>{const t=(o.b||o.byDay)?'varierer':((o.t&&o.t[0]&&o.t[0][0])?o.t[0][0]+'–'+o.t[0][1]:'');return'<tr><td>'+esc(x.dk)+'</td><td>'+esc(o.name||o.n||o.ab||'?')+'</td><td>'+esc(t)+'</td><td class="n">'+x.n+'</td><td><button class="d" onclick="shDel([\''+x.id+'\'])">Slet</button></td></tr>'}).join('')+'</table>'+(q&&rows.length?'<p><button class="d" onclick="shDel(['+rows.map(r=>"'"+r.x.id+"'").join(',')+'])">Slet alle '+rows.length+' viste</button></p>':'')}
async function shDel(ids){const rs=SH.filter(x=>ids.includes(x.id)).slice(0,5).map(x=>{let o={};try{o=JSON.parse(x.j)}catch(e){}return'<li>'+esc(x.dk)+' · '+esc(o.name||o.n||o.ab||'?')+'</li>'}).join('');if(!await cfm('<h3>Slet '+ids.length+' delt vagtform'+(ids.length>1?'er':'')+'?</h3><ul>'+rs+(ids.length>5?'<li>… og '+(ids.length-5)+' flere</li>':'')+'</ul><p>Fjernes for alle brugere. Brugernes egne vagtformer berøres ikke.</p>','Slet'))return;const r=await api('admin_share_del',{ids});if(r.ok){SH=SH.filter(x=>!ids.includes(x.id));shView()}else alert(r.error||'Noget gik galt.')}
async function trophy(id,del){const nt=(($('#tn'+id)||{}).value||'').trim(),u=D.users.find(x=>x.id===id);if(del&&u){if(!DEMO){const r=await api('admin_trophy',{del});if(!r.ok){alert(r.error||'Noget gik galt.');return}}u.trophies=u.trophies.filter(t=>t.id!==del);users();return}
 let tid=Date.now();if(!DEMO){const r=await api('admin_trophy',{id,note:nt,kind:TK});if(!r.ok){alert(r.error||'Noget gik galt.');return}tid=r.tid}
 TO=0;if(u){(u.trophies=u.trophies||[]).push({id:tid,note:nt,kind:TK});users()}}
async function ver(id){const r=await api('admin_verify',{id});if(r.ok)load();else alert(r.error||'Noget gik galt.')}
async function del(id,e,ok){if(!ok&&!confirm('Slet brugeren '+e+' og alle brugerens data permanent?'))return;const r=await api('admin_delete',{id});if(r.ok)load();else alert(r.error||'Noget gik galt.')}
async function load(){if(/[?&]demo/.test(location.search)){DEMO=1;try{MT=await (await fetch('okmeta.json')).json()}catch(e){}$('#ah').hidden=false;D=mkDemo();view();return}const me=await api('me');if(me._status!==200){$('#m').innerHTML='<div class="msg"><h2>Serveren svarer ikke</h2><p class="note">Tjek at api/ er uploadet, og at config.php findes.</p></div>';return}
 if(!me.user){$('#m').innerHTML='<div class="msg"><h2>Log ind først</h2><p>Log ind i <a href="app.html">appen</a> med en administratorkonto, og kom tilbage hertil.</p></div>';return}
 if(!me.admin){$('#m').innerHTML='<div class="msg"><h2>Ingen adgang</h2><p class="note"><a href="app.html">Tilbage til appen</a></p></div>';return}
 $('#ah').hidden=false;D=await api('admin_stats');try{NT=await api('admin_notify')}catch(e){NT=null};try{MT=await (await fetch('okmeta.json')).json()}catch(e){};if(D.error){$('#m').innerHTML='<div class="msg"><h2>'+esc(D.error)+'</h2></div>';return}view();shView()}
load();
</script></body></html>
