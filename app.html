function mAgo(n){const d=new Date();d.setMonth(d.getMonth()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function evSE(v){return[Math.round(new Date(v.sd+'T00:00')/864e5)*1440+tm(v.st),Math.round(new Date(v.ed+'T00:00')/864e5)*1440+tm(v.et)]}
function evList(e){return(e.evacs||[]).slice().sort((a,b)=>(a.sd+a.st)<(b.sd+b.st)?-1:1)}
function evAuto(e,v){const d0=new Date(v.sd+'T00:00'),[s0,e0]=evSE(v),H=isHol(PF(e).holi,d0),pe=entries().find(x=>x.emp===e.id&&x.k===v.sd&&x.work&&!x.s.oncall);if(wdi(d0)>=5||H||!pe)return{t:'F',pe};return{t:(s0>=pe.st&&e0<=pe.en)?'N':'U',pe}}
function evCalc(e,v){const r=PF(e),q=rates(e,(v.sd||'').slice(0,7)),[s0,e0]=evSE(v),min=Math.max(0,e0-s0),hrs=Math.ceil(min/60),days=Math.max(1,Math.ceil(min/1440)),vg=+(e.pay||{}).vg||0;
 if(r.id==='gl'){const au=evAuto(e,v),t=v.dt&&v.dt!=='A'?v.dt:au.t,eff=q.s.ro.eff||0,lbl={N:'I normal arbejdstid',U:'Uden for normal arbejdstid',F:'Planlagt fridag, weekend eller helligdag'}[t];let vh,h=0;
  if(v.cancel)vh={N:0,U:.5,F:1}[t];else{vh={N:.5,U:1,F:2}[t]*days;if(t==='U'){const ov=au.pe?Math.max(0,Math.min(e0,au.pe.en)-Math.max(s0,au.pe.st)):0;h=Math.ceil(Math.max(0,min-ov)/60)}else if(t==='F')h=hrs}
  return{days,min,t,lbl:lbl+(v.cancel?' (aflyst eller udskudt)':''),vh,h,pay:vh*r.vagtFee+h*eff,comp:(t==='F'&&!v.cancel)?1:0,norm:0,det:`${String(vh).replace('.',',')} × vagthonorar ${kr(r.vagtFee)}${h?` + ${h} t × ${kr(eff)}`:''}`}}
 if(v.kind!=='A'){const nh=Math.max(16,8*days);return{days,min,lbl:'Planlagt patientledsagelse',vh:0,h:0,pay:2*vg*days,comp:0,norm:nh,det:`${nh} normaltimer + 2 × varningsgjald × ${days} døgn`}}
 const h=Math.max(16,hrs),hr=q.s.a/r.divisor;return{days,min,lbl:'Akut patientledsagelse',vh:0,h,pay:h*hr+4*vg,comp:0,norm:0,det:`${h} t × ${kr(hr)} + 4 × varningsgjald`}}
function evs(){const o=[];for(const e of S.emps)for(const v of e.evacs||[]){if(!v.sd||!v.ed||v.cancel)continue;const[st,en]=evSE(v);if(en<=st)continue;const d0=new Date(v.sd+'T00:00');o.push({k:v.sd,d:d0,s:{ab:'EVAK',oncall:''},t:[v.st,v.et],day:Math.round(d0/864e5),st,en,wd:wdi(d0),emp:e.id,work:true,ev:true})}return o}
function setGrp(g,v){const e=emp(),r=R();e.extras=(e.extras||[]).filter(k=>{const x=r.extras.find(y=>y.k===k);return!(x&&x.grp===g)});if(v)e.extras.push(v);save();render()}
function amtTxt(ro){const f=x=>kr(x/12);if(ro.tiers){const t=ro.tiers;return t.length===2?`${f(t[0][1])} pr. md, ${f(t[1][1])} efter 5 års anciennitet`:`${f(t[0][1])} pr. md, stiger til ${f(t[t.length-1][1])}`}return ro.a?f(ro.a)+' pr. md':''}
function ratesV(){const r=R(),rows=[...r.roles.map(x=>[x.n,x.tiers?x.tiers.map(t=>kr(t[1]/12)).join(' → '):(x.a?kr(x.a/12):'indtastes af dig')]),...r.quals.map(x=>['Kvalifikationstillæg: '+x.n,'+ '+kr(x.a/12)]),...r.extras.map(x=>[x.n,'+ '+kr(x.a/12)])];
 return`<details class="card"><summary><b>Satser fra overenskomsten</b></summary><table>${rows.map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1]}</td></tr>`).join('')}</table><p class="note">Beløb pr. måned før skat og pension. ${r.id==='dk'?'Overarbejde er 1/1924 af årslønnen plus 50 %. Vagt uden for tjenestestedet er 1/3 af timelønnen.':r.id==='gl'?'Vagthonorar er 1.500 kr. pr. vagt. Effektiv tjeneste honoreres med 400 kr. i timen for reservelæger og 480 kr. for afdelingslæger og opefter.':''}</p></details>`}
let evf={};
function evDef(){const t=dkey(new Date());return{sd:t,st:'08:00',ed:t,et:'16:00',dt:'A',kind:'P',cancel:false,note:''}}
function evSet(k,v){evf[k]=v;if(k==='sd'&&(!evf.ed||evf.ed<v))evf.ed=v;render()}
function evOk(v){return!!(v.sd&&v.ed&&v.st&&v.et&&evSE(v)[1]>evSE(v)[0])}
function evAdd(){const e=emp(),v=Object.assign({},evf);if(!evOk(v)){tell('Udfyld dato og tid for afrejse og hjemkomst. Hjemkomst skal ligge efter afrejse.');return}v.id=uid();e.evacs.push(v);evf=evDef();save();render()}
function evDel(id){ask('Slet evakueringen?',()=>{const e=emp();e.evacs=e.evacs.filter(x=>x.id!==id);save();render()})}
function evV(){const e=emp(),r=R();if(!r.evac)return`<h2>Evakuering</h2><div class="card"><p>Patienttransport findes i overenskomsterne for Grønland og Færøerne. Den aktive ansættelse følger ${r.short}.</p></div>`;
 if(!evf.sd)evf=evDef();const gl=r.id==='gl',L=evList(e).filter(v=>v.sd.startsWith(S.ym)),C=L.map(v=>evCalc(e,v)),tot=C.reduce((a,c)=>a+c.pay,0),cmp=C.reduce((a,c)=>a+c.comp,0),ok=evOk(evf),pv=ok?evCalc(e,evf):null,au=ok&&gl?evAuto(e,evf).t:'',al={N:'i normal arbejdstid',U:'uden for normal arbejdstid',F:'planlagt fridag'};
 const info=gl?'<p><b>Evakuering er patienttransport (§ 46).</b> Den starter, når du rejser fra tjenestestedet, og slutter, når du er tilbage. På en planlagt fridag, weekend eller helligdag starter betalingen, når du møder på tjenestestedet. Der betales pr. påbegyndt døgn: ½ vagthonorar i normal arbejdstid på en arbejdsdag, 1 uden for normal arbejdstid på en arbejdsdag og 2 på en planlagt fridag, weekend eller helligdag. Uden for normal arbejdstid og på fridage kommer timebetaling for hver påbegyndt time (400 kr. for reservelæger, 480 kr. for afdelingslæger og opefter). På fridage optjener du også en erstatningsfridag. Aflyses transporten under 2 timer før afrejse, eller udskydes den mere end 8 timer, får du 0, ½ eller 1 vagthonorar efter dagtypen.</p>':'<p><b>Patientledsagelse (§ 22).</b> Planlagt: 8 timers normaltjeneste pr. døgn, mindst 16 timer, og dobbelt varningsgjald pr. påbegyndt døgn. Akut (uopsættelig transport planlagt uden om normal visitation): betaling time for time for hver påbegyndt time, til patienten er afhændet, mindst 16 timer, og firedobbelt varningsgjald første døgn. Størrelsen på varningsgjald står ikke i overenskomsten, så du indtaster den under Løn. Akutte timer afregnes her med 1/2080 af årsløn pr. time. Tjek det mod din lønseddel.</p>';
 return`<div class="row"><h2 class="sp">Evakuering – ${e.dep}</h2><button class="b" onclick="mv(-1)">‹</button><b>${MON[+S.ym.slice(5)-1]} ${S.ym.slice(0,4)}</b><button class="b" onclick="mv(1)">›</button></div>
 <details class="card"><summary><b>Hvordan betales evakuering?</b></summary>${info}</details>
 <div class="card"><h3>Ny evakuering</h3><div class="row"><label>Afrejse, dato<input type="date" value="${evf.sd}" onchange="evSet('sd',this.value)"></label><label>Tid<input type="time" value="${evf.st}" onchange="evSet('st',this.value)"></label><label>Hjemkomst, dato<input type="date" value="${evf.ed}" onchange="evSet('ed',this.value)"></label><label>Tid<input type="time" value="${evf.et}" onchange="evSet('et',this.value)"></label></div>
 <div class="row" style="margin-top:10px">${gl?`<label>Dagtype<select onchange="evSet('dt',this.value)"><option value="A" ${evf.dt==='A'?'selected':''}>Automatisk ud fra din plan${au?' ('+al[au]+')':''}</option><option value="N" ${evf.dt==='N'?'selected':''}>I normal arbejdstid på en arbejdsdag</option><option value="U" ${evf.dt==='U'?'selected':''}>Uden for normal arbejdstid på en arbejdsdag</option><option value="F" ${evf.dt==='F'?'selected':''}>Planlagt fridag, weekend eller helligdag</option></select></label><label style="flex-direction:row;align-items:center;gap:8px;margin-top:18px"><input type="checkbox" ${evf.cancel?'checked':''} onchange="evSet('cancel',this.checked)"> Aflyst under 2 timer før afrejse, eller udskudt mere end 8 timer</label>`:`<label>Type<select onchange="evSet('kind',this.value)"><option value="P" ${evf.kind!=='A'?'selected':''}>Planlagt patientledsagelse</option><option value="A" ${evf.kind==='A'?'selected':''}>Akut patientledsagelse</option></select></label>`}<label class="sp">Note (valgfri)<input value="${evf.note||''}" oninput="evf.note=this.value"></label></div>
 ${pv?`<p style="margin-top:10px"><b>${pv.lbl}</b>: ${pv.days} døgn, ${pv.det}${pv.comp?', 1 erstatningsfridag':''}. Giver <b>${kr(pv.pay)}</b>.${!gl&&!(+(e.pay||{}).vg)?' Indtast varningsgjald under Løn for at få beløbet med.':''}</p>`:'<p class="note" style="margin-top:10px">Udfyld afrejse og hjemkomst for at se beregningen.</p>'}
 <button class="b p" onclick="evAdd()" style="margin-top:6px">Tilføj evakuering</button></div>
 <div class="card" style="overflow-x:auto"><h3>${MON[+S.ym.slice(5)-1]}</h3><table><tr><th>Tidsrum</th><th>Type</th><th class="n">Døgn</th><th>Beregning</th><th class="n">Beløb</th><th></th></tr>${L.map((v,i)=>`<tr><td>${v.sd} ${v.st} → ${v.ed===v.sd?'':v.ed+' '}${v.et}${v.note?`<br><span class="note">${v.note}</span>`:''}</td><td>${C[i].lbl}</td><td class="n">${C[i].days}</td><td>${C[i].det}${C[i].comp?'<br><span class="note">1 erstatningsfridag</span>':''}</td><td class="n">${kr(C[i].pay)}</td><td><button class="b d" onclick="evDel('${v.id}')">Slet</button></td></tr>`).join('')||'<tr><td colspan="6">Ingen evakueringer i denne måned.</td></tr>'}${L.length?`<tr><th colspan="4">I alt${cmp?' · '+cmp+' erstatningsfridag'+(cmp>1?'e':''):''}</th><th class="n">${kr(tot)}</th><th></th></tr>`:''}</table></div>`}
const evOn=k=>S.emps.some(e=>(e.evacs||[]).some(v=>v.sd===k));
S=load();render();initDb();
</script></body></html>
