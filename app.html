[indsæt din vagtplan her som tekst, tabel eller billede]`;

const npNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');
function npKeys(e){const dk=e.shak?'shak:'+String(e.shak).replace(/\W/g,'').toUpperCase():'navn:'+npNorm(e.hos)+'|'+npNorm(e.dep);return{dk,lv:(e.ok||'dk')+':'+(e.pos||'')}}
function npHash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)+(h1>>>0).toString(16)}
const npLags=['Forvagtslag','Bagvagtslag','Dagvagt','Ambulatorium','Akutmodtagelse','Stuegang'];
function npShareBar(e,r){if(!AUTH.api)return'';if(!AUTH.user)return'<p class="note" style="margin-top:10px">Log ind for at hente kollegers normperioder eller dele dine egne.</p>';
 return`<div class="row" style="margin-top:10px"><button class="b" onclick="npsOpen('get')">Hent fra kolleger</button><button class="b" onclick="npsOpen('share')">Del mine normperioder</button></div>${npsPanel(e,r)}`}
async function npsOpen(mode){const e=emp();NPS={mode,items:null,msg:'',sel:{}};render();
 if(mode==='get'){const k=npKeys(e),j=await api('np_list',k);if(!NPS)return;if(j.items)NPS.items=j.items;else{NPS.items=[];NPS.msg=j.error||'Kunne ikke hente.'}render()}
 else{periods(e).forEach(p=>NPS.sel[p.id]=true);const l0=(periods(e).find(p=>p.lag)||{}).lag;NPS.lag=['Forvagtslag','Bagvagtslag'].includes(l0)?l0:'';render()}}
function npsClose(){NPS=null;render()}
function npsTog(id){NPS.sel[id]=!NPS.sel[id];render()}
function npsAdd(i){const e=emp(),r=R(),it=NPS.items[i];if(!it)return;if(periods(e).some(p=>p.from===it.from&&pEnd(p)===it.to)){tell('Du har allerede en normperiode med de datoer.');return}
 e.periods.push({id:uid(),from:it.from,to:it.to,weeks:Math.max(1,Math.round(pDaysOf(it.from,it.to)/7)),hrs:it.hrs&&it.hrs!==r.weekHours?it.hrs:'',vt:it.vt||'',lag:it.lag||''});save();render()}
function npsAddLag(lag){const e=emp();NPS.items.filter(x=>(x.lag||'')===lag).forEach((_,i)=>0);const idx=NPS.items.map((x,i)=>[x,i]).filter(([x])=>(x.lag||'')===lag).map(([,i])=>i);let n=0;const r=R();
 for(const i of idx){const it=NPS.items[i];if(periods(e).some(p=>p.from===it.from&&pEnd(p)===it.to))continue;e.periods.push({id:uid(),from:it.from,to:it.to,weeks:Math.max(1,Math.round(pDaysOf(it.from,it.to)/7)),hrs:it.hrs&&it.hrs!==r.weekHours?it.hrs:'',vt:it.vt||'',lag:it.lag||''});n++}
 save();render();tell(n?n+' normperioder er lagt ind.':'Du havde dem allerede.')}
async function npsShare(){const e=emp(),r=R(),k=npKeys(e),lag=(NPS&&NPS.lag)||'',its=periods(e).filter(p=>NPS.sel[p.id]).map(p=>({lag:lag.trim().slice(0,40),from:p.from,to:pEnd(p),hrs:+p.hrs||r.weekHours,vt:p.vt||''}));
 if(!its.length){tell('Vælg mindst én normperiode.');return}
 if(!lag.trim()){tell('Vælg forvagt eller bagvagt, så kollegerne kan finde de rigtige perioder.');return}
 const j=await api('np_put',Object.assign({items:its},k));if(j.ok){NPS=null;render();tell('Tak! '+j.n+' normperioder er delt. De er anonyme og kan ses af andre brugere på samme afdeling og niveau.')}else tell(j.error||'Kunne ikke dele.')}
function npsPanel(e,r){if(!NPS)return'';const k=npKeys(e),T=n=>String(Math.round(n*100)/100).replace('.',','),ln=n=>Math.floor(n/7)+' uger'+(n%7?' + '+n%7+' d':'');
 const head=t=>`<div class="row" style="margin-bottom:6px"><b class="sp">${t}</b><button class="b" style="padding:2px 10px;font-size:12px" onclick="npsClose()">Luk</button></div>`,wrap=x=>`<div style="margin-top:12px;padding:14px;border:1px solid var(--acc);border-radius:12px;background:var(--bg)">${x}</div>`;
 const where=`<p class="note" style="margin:0 0 8px">Afdeling: <b>${esc(e.hos||'')}${e.hos&&e.dep?' · ':''}${esc(e.dep||'')}</b>${e.shak?' (SHAK '+esc(e.shak)+')':''}. Niveau: <b>${esc((R().roles||[]).find(x=>x.k===e.pos)?.n||e.pos||'?')}</b>. Du ser kun perioder fra brugere med samme afdeling og niveau, så udfyld afdelingen og SHAK-koden på samme måde som dine kolleger.</p>`;
 if(NPS.mode==='get'){if(NPS.items===null)return wrap(head('Normperioder fra kolleger')+'<p class="note">Henter ...</p>');
  const g={};NPS.items.forEach((x,i)=>{(g[x.lag||'']=g[x.lag||'']||[]).push([x,i])});const ks=Object.keys(g).sort();
  return wrap(head('Normperioder fra kolleger')+where+(NPS.msg?`<p style="color:var(--bad)"><b>${esc(NPS.msg)}</b></p>`:'')+(ks.length?ks.map(l=>`<div class="row" style="margin-top:10px"><b class="sp">${l?esc(l):'Uden vagtlag'}</b><button class="b p" style="padding:3px 10px;font-size:12.5px" onclick="npsAddLag('${esc(l).replace(/'/g,'&#39;')}')">Tilføj alle</button></div>${g[l].sort((a,b)=>a[0].from<b[0].from?-1:1).map(([x,i])=>`<div class="row" style="gap:8px;padding:6px 0;border-top:1px solid var(--line)"><span class="sp"><b>${dd(x.from)} – ${dd(x.to)}</b><br><span class="note" style="margin:0">${ln(pDaysOf(x.from,x.to))} · ${T(x.hrs)} t/uge${x.vt?' · '+esc(VT[x.vt]||''):''} · ${x.n} ${x.n===1?'kollega':'kolleger'}</span></span><button class="b" style="padding:3px 10px;font-size:12.5px" onclick="npsAdd(${i})">Tilføj</button></div>`).join('')}`).join(''):`<p class="note">Ingen har delt normperioder for denne afdeling og dette niveau endnu. Del dine egne, så kan kollegerne bruge dem.</p>`));}
 const ps=periods(e);return wrap(head('Del mine normperioder')+where+(ps.length?`<div style="margin-top:4px"><span class="note">Dit vagtlag</span><div class="row" style="gap:8px;margin-top:4px">${[['Forvagtslag','Forvagt'],['Bagvagtslag','Bagvagt']].map(([v,l])=>`<button class="b ${NPS.lag===v?'p':''}" onclick="NPS.lag='${v}';render()">${l}</button>`).join('')}</div></div>
  ${ps.map(p=>`<label style="flex-direction:row;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" ${NPS.sel[p.id]?'checked':''} onchange="npsTog('${p.id}')">${dd(p.from)} – ${dd(pEnd(p))} · ${T(+p.hrs||R().weekHours)} t/uge</label>`).join('')}
  <p class="note">Det, der deles: afdeling, niveau, vagtlag og periodernes datoer, ugenorm og vagttype. Andre brugere kan se, hvor mange kolleger der har delt den samme periode, men ikke hvem.</p><button class="b p" onclick="npsShare()">Del valgte</button>`:'<p class="note">Du har ingen normperioder at dele endnu.</p>'))}

/* ===== Del og hent vagtformer (samme afdeling) + forslag om at dele ===== */
let SFS=null;const SFC={},NPC={};
const sfOk=()=>!!(AUTH.api&&AUTH.user);
const sfSig=x=>npNorm(x.name||x.ab)+'|'+(x.t||[]).slice(0,1).map(a=>(a[0]||'')+(a[1]||'')).join('');
function sfPack(s){return{n:String(s.name||'').slice(0,60),a:String(s.ab||'').slice(0,8),c:s.color,b:s.byDay?1:0,t:(s.t||[]).slice(0,7).map(a=>[a[0]||'',a[1]||'',a[2]?1:0]),o:s.oncall||'',l:s.leave?1:0}}
function sfClean(p){try{const tm=v=>/^\d\d:\d\d$/.test(v)||v==='';if(!p||!Array.isArray(p.t)||p.t.length!==7)return null;const t=p.t.map(a=>{if(!Array.isArray(a)||!tm(a[0])||!tm(a[1]))throw 0;const r=[a[0],a[1]];if(a[2])r.push(true);return r});
 const n=String(p.n||'').slice(0,60),a=String(p.a||'').slice(0,8);if(!n&&!a)return null;if(!t.some(x=>x[0]&&x[1]))return null;
 return{name:n,ab:a||abbr(n),color:/^#[0-9a-fA-F]{6}$/.test(p.c)?p.c:COLORS[2],byDay:!!p.b,t,oncall:['on','off'].includes(p.o)?p.o:'',leave:!!p.l}}catch(e){return null}}
async function sfFetch(){const e=emp();if(!e||!sfOk())return;const dk=npKeys(e).dk;if(SFC[dk]!==undefined)return;SFC[dk]=null;
 const j=await api('sf_list',{dk});SFC[dk]=(j.items||[]).map(x=>{let p=null;try{p=sfClean(JSON.parse(x.j))}catch(_){}return p&&Object.assign(p,{n:x.n})}).filter(Boolean);render()}
function sfMissing(){const e=emp();if(!e||!sfOk())return[];const L=SFC[npKeys(e).dk]||[],have=new Set(shifts().map(sfSig));const seen=new Set();return L.filter(x=>{const g=sfSig(x);if(have.has(g)||seen.has(g))return false;seen.add(g);return true})}
function sfBar(){if(!sfOk())return AUTH.api?'<p class="note" style="margin-top:10px">Log ind for at hente kollegers vagtformer eller dele dine egne.</p>':'';sfFetch();
 const m=sfMissing(),e=emp(),pn=SFS?sfPanel(m):'';
 return`<div class="card" style="margin-top:12px"><div class="row" style="gap:8px"><b class="sp">Kolleger på ${esc(e.dep||'afdelingen')}</b><button class="b ${m.length?'p':''}" onclick="sfOpen('get')">Hent vagtformer${m.length?' ('+m.length+')':''}</button><button class="b" onclick="sfOpen('share')">Del mine</button></div>${m.length&&!SFS?`<p class="note" style="margin:8px 0 0">Kolleger på samme afdeling har delt ${m.length} vagtform${m.length>1?'er':''}, du ikke har endnu.</p>`:''}${pn}</div>`}
function sfOpen(mode){SFS={mode,sel:{}};if(mode==='share')shifts().forEach(s=>SFS.sel[s.id]=true);render()}
function sfClose(){SFS=null;render()}
function sfTog(id){SFS.sel[id]=!SFS.sel[id];render()}
function sfAddAll(idx){const m=sfMissing();let n=0;for(const i of idx){const x=m[i];if(x){shifts().push(Object.assign({id:uid()},{name:x.name,ab:x.ab,color:x.color,byDay:x.byDay,t:JSON.parse(JSON.stringify(x.t)),oncall:x.oncall,leave:x.leave}));n++}}if(n){save()}SFS=n&&idx.length>1?null:SFS;render()}
function sfRow(x,right){const t=x.byDay?'varierer pr. ugedag':tt(x.t[0])+' · '+fmt(dur(x.t[0]));return`<div class="lg nn" style="--c:${x.color};margin:6px 0"><span class="lgt"><b>${esc(x.name||x.ab)}</b><span>${t}${x.leave?' · fravær':''}</span></span>${right}</div>`}
function sfPanel(m){const wrap=(h,b)=>`<div style="margin-top:12px;padding:14px;border:1px solid var(--acc);border-radius:12px;background:var(--bg)"><div class="row" style="margin-bottom:6px"><b class="sp">${h}</b><button class="b" style="padding:2px 10px;font-size:12px" onclick="sfClose()">Luk</button></div>${b}</div>`;
 if(SFS.mode==='get'){if(SFC[npKeys(emp()).dk]==null)return wrap('Vagtformer fra kolleger','<p class="note">Henter ...</p>');
  return wrap('Vagtformer fra kolleger',m.length?`<p class="note" style="margin:0 0 6px">Kun vagtformer fra samme afdeling vises. Tiderne kan du rette bagefter.</p>`+m.map((x,i)=>sfRow(x,`<button class="b p" style="padding:3px 10px;font-size:12.5px" onclick="sfAddAll([${i}])">Tilføj</button>`)).join('')+`<div class="row" style="margin-top:8px"><button class="b p" onclick="sfAddAll([${m.map((_,i)=>i).join(',')}])">Tilføj alle</button></div>`:'<p class="note">Der er ingen nye vagtformer fra kolleger på denne afdeling endnu.</p>')}
 const sh=shifts();return wrap('Del mine vagtformer',sh.length?sh.map(s=>`<label style="flex-direction:row;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" ${SFS.sel[s.id]?'checked':''} onchange="sfTog('${s.id}')">${esc(s.name||s.ab)} <span class="note">${s.byDay?'varierer':tt(s.t[0])}</span></label>`).join('')+`<p class="note">Det, der deles: afdeling, navn, tider, farve og type.</p><button class="b p" onclick="sfShare()">Del valgte</button>`:'<p class="note">Du har ingen vagtformer at dele endnu.</p>')}
async function sfPut(list){const e=emp(),dk=npKeys(e).dk,j=await api('sf_put',{dk,items:list.map(s=>JSON.stringify(sfPack(s)))});if(j.ok){delete SFC[dk];return j.n}tell(j.error||'Kunne ikke dele.');return 0}
async function sfShare(){const l=shifts().filter(s=>SFS.sel[s.id]);if(!l.length){tell('Vælg mindst én vagtform.');return}const n=await sfPut(l);if(n){SFS=null;render();tell('Tak! '+n+' vagtformer er delt anonymt med kolleger på samme afdeling.')}}
function sfOffer(s){if(!sfOk())return;ask('Vil du dele vagtformen "'+(s.name||s.ab)+'" anonymt med kolleger på samme afdeling? Kun navn, tider, farve og type deles.',async()=>{const n=await sfPut([s]);if(n)tell('Delt. Tak!')})}
function npOffer(o){if(!sfOk())return;const e=emp(),r=R(),k=npKeys(e);ask('Vil du dele normperioden '+dd(o.from)+' – '+dd(o.to)+' anonymt med kolleger på samme afdeling og niveau? Kun datoer, ugenorm, vagtlag og vagttype deles.',async()=>{const j=await api('np_put',Object.assign({items:[{lag:String(o.lag||'').slice(0,40),from:o.from,to:o.to,hrs:+o.hrs||r.weekHours,vt:o.vt||''}]},k));if(j.ok){delete NPC[k.dk+k.lv];tell('Delt. Tak!')}else tell(j.error||'Kunne ikke dele.')})}
function npSug(){if(!sfOk())return'';const e=emp(),k=npKeys(e),key=k.dk+k.lv;if(NPC[key]===undefined){NPC[key]=null;api('np_list',k).then(j=>{NPC[key]=(j.items||[]).filter(x=>!periods(e).some(p=>p.from===x.from&&pEnd(p)===x.to));render()});return''}
 const n=(NPC[key]||[]).length;return n?`<div class="row" style="gap:8px;margin:8px 0;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,var(--card))"><span class="sp" style="font-size:13.5px"><b>${n} normperiode${n>1?'r':''}</b> er delt af kolleger på samme afdeling og niveau.</span><button class="b p" onclick="NPE=null;npsOpen('get')">Se dem</button></div>`:''}

/* ===== Hjemmeskærm / webapp ===== */
let INST_EVT=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST_EVT=e;try{render()}catch(x){}});
addEventListener('appinstalled',()=>{INST_EVT=null;try{localStorage.setItem('vp_inst','1')}catch(e){}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isPhone=()=>isIOS()||/Android/i.test(navigator.userAgent);
const instOff=()=>{try{return localStorage.getItem('vp_inst')==='1'}catch(e){return false}};
function instBanner(){if(S.tab!=='work'||!isPhone()||isStandalone()||instOff())return'';
 return`<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="sp" style="min-width:200px"><b>Brug Vagtplan som app</b><div class="note">Læg den på din hjemmeskærm, så åbner den med ét tryk.</div></div><button class="b p" onclick="S.tab='inst';save();render()">Vis hvordan</button><button class="b" onclick="instHide()">Luk</button></div>`}
function instHide(){try{localStorage.setItem('vp_inst','1')}catch(e){}render()}
async function instGo(){if(!INST_EVT)return;INST_EVT.prompt();try{await INST_EVT.userChoice}catch(e){}INST_EVT=null;render()}
function instV(){const ios=isIOS(),and=/Android/i.test(navigator.userAgent),st=isStandalone(),
 box=(t,open,body)=>`<details class="card" ${open?'open':''}><summary><b>${t}</b></summary>${body}</details>`,
 ol=a=>'<ol style="margin:10px 0 0;padding-left:20px;line-height:1.6">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
 return`<h2>Hurtig adgang på telefonen</h2><p class="note">Du kan lægge ${esc(APP)} på din hjemmeskærm. Så får du et ikon som en almindelig app, og siden åbner uden browserens adresselinje.${st?' Du bruger allerede siden som app.':''}</p>
 ${INST_EVT?`<div class="card"><b>Din browser kan installere appen direkte.</b><p style="margin:8px 0 0"><button class="b p" onclick="instGo()">Installér ${esc(APP)}</button></p></div>`:''}
 ${box('iPhone og iPad (Safari)',ios||!and,ol(['Åbn siden i <b>Safari</b>. Åbner du et link fra en anden app, så vælg at åbne det i Safari.','Tryk på <b>Del</b>-knappen (firkanten med en pil op). På iPhone står den nederst, på iPad øverst.','Rul ned i menuen og tryk på <b>Føj til hjemmeskærm</b>.','Tryk på <b>Tilføj</b>. Ikonet ligger nu på din hjemmeskærm.'])+'<p class="note">Bruger du Chrome på iPhone, finder du også Føj til hjemmeskærm under Del-knappen i nyere versioner af iOS.</p>')}
 ${box('Android (Chrome)',and||!ios,ol(['Åbn siden i <b>Chrome</b>.','Tryk på menuen <b>⋮</b> (tre prikker) øverst til højre.','Tryk på <b>Installér app</b> eller <b>Føj til startskærm</b>.','Bekræft med <b>Installér</b> eller <b>Tilføj</b>. Ikonet ligger nu på din startskærm og i din appoversigt.'])+'<p class="note">Bruger du Samsung Internet: Tryk på menuen (tre streger), vælg <b>Tilføj side til</b> og derefter <b>Startskærm</b>.</p>')}
 <div class="card"><h3>Gem dine data med en konto</h3><p class="note" style="margin:0">Log ind, så følger dine data med mellem browseren, appen på hjemmeskærmen og din computer. Uden konto ligger dine data kun i den ene browser. På iPhone er en app på hjemmeskærmen adskilt fra Safari, så data du har lagt ind i Safari, ses ikke i appen, før du logger ind.</p></div>
 <div class="card"><h3>Kalenderfilen</h3><p class="note" style="margin:0">Under Opsætning, Kalenderfil kan du hente dine vagter, så de også står i telefonens kalender.</p></div>`}



S=load();render();authInit();
</script></body></html>
