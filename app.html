 ulPct:{add:1,saNoSp:1,krFac:1,pgKr:1,eve:[17,23,0],nat:[23,6,0],eveKr:55.89,natKr:18.07,saKr:51.18,moSa:4,we:50,hol:100,sp:[['12-24',7,24,50],['05-01',0,24,50],['06-05',0,24,50],['12-31',12,24,50]],pg:[]},
 pen:{k:'pct',pct:6.4,ownShare:1/3,text:'Arbejdsgiveren og du betaler tilsammen 6,4 % til Lægernes Pension af timelønnen, funktionstillæggene og aften-, nat- og lørdagstillæggene (OK § 14). En tredjedel er din egen andel. Søn- og helligdagstillæg, overarbejde og rådighedsvagt giver ikke pension. Efter mere end 3 måneders ansættelse kan du aftale en højere pensionsindbetaling mod en tilsvarende lønnedsættelse.'},
 beta:'Grundmodel for lægestuderende som SPV og ventilatør i regionerne (FADL og Regionernes Lønnings- og Takstnævn, OK 2024–26): timeløn, funktionstillæg og tillæg er satserne pr. 1.10.2026 fra FADL Vagt, og paragrafferne er fra overenskomsten. Antaget: aften- og nattillægget kl. 17–06, nattillægget kl. 23–06 og lørdagstillægget lægges oven i hinanden. 1. maj og grundlovsdag er hele dagen, og nytårsaftensdag er fra kl. 12. Overarbejde (50 % ud over 8 timer i fast vagt), rådighedsvagt, holdbetaling, kursusgodtgørelse, tillæg for 200 % på helligdage efter 6 dage i træk og lokalaftaler er ikke med. Tjek mod din lønseddel.',
 roles:[
  {k:'spv',n:'Sygeplejevikar (SPV)',t:'SPV',d:'Lægestuderende ansat som sygeplejevikar. Timelønnen følger din region: Hovedstaden og Sjælland har den højeste sats. Har du været på sygeplejevikarkurset (OK § 2)? Så er du omfattet. Slagelse Sygehus har den lavere sats, og der vælger du «SPV, Slagelse Sygehus».',a:rd2(180.97)*1924,reg:{'Region Hovedstaden':rd2(180.97)*1924,'Region Sjælland':rd2(180.97)*1924,_:rd2(177.67)*1924}},
  {k:'spvs',n:'SPV, Slagelse Sygehus',t:'SPV',d:'Sygeplejevikar på Slagelse Sygehus. Satsen er den samme som i de tre andre regioner.',a:rd2(177.67)*1924},
  {k:'vt',n:'Ventilatør',t:'Ventilatør',d:'Lægestuderende ansat som ventilatør med godkendt ventilationskursus (OK § 5). Samme timeløn i alle regioner fra 1. april 2025.',a:rd2(188.67)*1924}],
 extras:[
  {k:'fa',n:'Funktionstillæg A (SPV): udvidet fagligt niveau',hr:7.53,d:'Kun i holdtjeneste. Kræver mindst 4. semester, 200 timer som SPV og fagspecifik oplæring (OK § 4 stk. 1). Kan ikke kombineres med B. Giver pension.'},
  {k:'fb',n:'Funktionstillæg B (SPV): avanceret specialeområde',hr:16.43,d:'Kun i holdtjeneste. Kræver mindst 7. semester, første kliniske ophold i medicin og kirurgi, bestået basal farmakologi og 300 timer som SPV (OK § 4 stk. 2). Kan ikke kombineres med A. Giver pension.'},
  {k:'fc',n:'Funktionstillæg C (ventilatør): udvidet fagligt niveau',hr:8.93,d:'Kun i holdtjeneste, fx børneventilation, kardiologi og dialyse. Kræver mindst 5. semester (KU/SDU) eller 6. semester (AU/AAU), 400 timer som SPV og 200 timer som ventilatør (OK § 7 stk. 1). Giver pension.'}],
 ancTxt:'Anciennitet betyder ikke noget for timelønnen. Efter 3 sammenhængende måneder i holdtjeneste overgår du til funktionærlovens vilkår (OK § 8 stk. 2).',
 rt:{sick:'Du har ikke ret til løn under sygdom, men til sygedagpenge efter dagpengeloven (OK § 25). Fra 1. april 2025 kan du få sygedagpenge, selv om du ikke opfylder kravene, hvis du har været ansat inden for overenskomstens område de seneste 4 uger før fraværet. Efter 3 sammenhængende måneder i holdtjeneste overgår du til funktionærlovens vilkår (§ 8 stk. 2).',bar:'Graviditetsorlov: løn i holdtjeneste fra 8. til 5. uge før termin svarende til barseldagpengesatsen, højst 37 timer om ugen og ikke pensionsgivende (OK § 9 stk. 1). Mor har ret til 2 ugers løn efter fødslen, og far eller medmor til op til 2 ugers løn inden for de første 14 uger (§ 9 stk. 2–3), hvis arbejdsgiveren kan få fuld dagpengerefusion.',sy:'Barnets 1. og 2. sygedag: for funktionærer i holdtjeneste får du sædvanlig løn uden arbejds- og arbejdstidsbestemte tillæg. Barnet skal være under 18 år og bo hos dig (OK § 10).'}};

 n:'Danmark – Lægestuderende som lægevikar i underordnet lægestilling (FADL / Danske Regioner, OK 33.05.1, løn pr. 1.10.2026)',short:'Lægevikar',
 pen:{k:'pct',pct:5.63,ownShare:1/3,text:'Arbejdsgiveren og du betaler tilsammen 5,63 % af den pensionsgivende løn til Lægernes Pension (OK § 6). En tredjedel er din egen andel. Tillæg for ekstraordinær tjeneste og tilkald giver 12 %, men er ikke med her. Er du ansat over 3 måneder, kan du aftale en højere indbetaling mod en tilsvarende lønnedsættelse.'},
 beta:'Grundmodel for lægestuderende ansat som vikar i underordnet lægestilling (OK 33.05.1, FADL og Regionernes Lønnings- og Takstnævn, fra 1. april 2024): timelønnen er grundløn 310.983 kr. plus særligt tillæg 22.312 kr. om året (31.3.2018-niveau fra 1. april 2025) divideret med 1.924 og reguleret til 1.10.2026. Antaget: det særlige tillæg indgår i timelønnen. Ulempetillæg er de samme satser som for yngre læger, fordi overenskomsten henviser til dem (§ 8), og hviletid og fridøgn efter OK 33.06.1. Overarbejde (50 % ud over 7,5 timer pr. vagt), ekstraordinære tilkald, holdtjeneste, decentral løn og lokalaftaler er ikke med. Tjek mod din lønseddel.',
 roles:[{k:'lv',n:'Lægestuderende som lægevikar',t:'Lægevikar',d:'Lægestuderende, der har afsluttet 8. semester (2. semester på kandidatdelen), ansat som vikar i underordnet lægestilling i regional tjeneste (OK § 1). Én fast timeløn uden anciennitetstrin.',a:rd2(333295*FADLF)}],
 ancTxt:'Anciennitet betyder ikke noget for timelønnen. Du kan være indskrevet på et lægevidenskabeligt fakultet i op til 7 år efter, at du opfyldte kravet (OK § 2 stk. 1).',
 rt:{sick:'Du har ret til løn under sygdom, indtil ansættelsen ophører. Sygelønnen svarer til den senest oppebårne løn og er pensionsgivende (OK § 9). Sygdom under pålagt vagt giver erstatning for de særlige ydelser efter cirkulære C.125.',bar:'Mor med månedsløn har ret til 2 ugers løn efter fødslen. Far eller medmor med månedsløn har ret til 2 ugers løn inden for de første 14 uger efter fødslen (OK § 10 stk. 2–3). Retten forudsætter fuld dagpengerefusion, ellers kan lønnen være nedsat.',sy:'Barnets 1. og 2. sygedag: du får tjenestefrihed med løn, men uden arbejds- og arbejdstidsbestemte tillæg. Barnet skal være under 18 år og bo hos dig, og det skal kunne lade sig gøre på tjenestestedet (OK § 10 stk. 1).'}};

RM.sped.kontrol='Forhandlingsprotokollen (fornyelse 2026), lønoversigten 2026–2029, aftalen om vagt-/tjenestetillæg for det døgnpædagogiske område og arbejdstidsaftalen (OK-18-udgaven) er læst. Overenskomsten F32.38.1 er ikke læst i fuld tekst. Ulempesatser i kroner er fra 2018 og kan være regulereret siden. Tillæggene for lukkede afdelinger er ikke nævnt i nogen af de læste kilder og skal bekræftes.';
RM.sped.intro='Pension 15,0 % for basisstillinger (15,1 % fra 1.4.2027), egenbidrag 1/3. Basisstilling: trin 27 + 23.068 kr., efter 6 år trin 30, efter 10 år trin 34 + 32.788 kr. (2018-niveau). Fra 1.4.2027 stiger grundlønstillægget med 5.475 kr., og der kommer et trin efter 15 år.';
U('sped','vt',{ver:'ok',hj:'Aftale om vagt-/tjenestetillæg, døgnpædagogisk område, OK24, § 10 stk. 1–7',amt:'7.631 kr. om året i appen (6.370 kr. i 31.3.2018-niveau)',req:[rmF('vt300','Mindst 300 timers vagtarbejde uden for dagarbejdstid i kalenderåret')],pg:true,kontrol:'Effektiv tjeneste, hvor der ydes tillæg efter § 12, tæller; rådighed på tjenestestedet kan efter lokal aftale tælle med. Optjening i kalenderåret og udbetaling i 12 måneder fra 1. februar året efter (første gang fra 1.1.2025 på 2024-timer). Bortfalder automatisk, hvis du har under 300 timer, og genopstår, når kravet nås. Nyansatte får tillægget på forskud, hvis kravet forventes opfyldt. Ved skift af stilling hos samme arbejdsgiver behandles du som nyansat. Faste løndele indgår i overarbejdsgrundlaget. Appens 7.631 kr. svarer til en regulering på ca. 19,8 % af 6.370 kr., mens vagttillægget hos HK og Sundhedskartellet er reguleret med ca. 20,5 %, så reguleringsfaktoren bør kontrolleres.'});

const SC_PROMPT=`Du skal omsætte min vagtplan til JSON, som jeg kan indlæse i min vagtplanlægger. Svar KUN med JSON i én kodeblok, uden forklaring.

Format:
{"format":"vagtplan-v1","shifts":[{"ab":"D","name":"Dagvagt","start":"07:45","end":"15:45","oncall":"","leave":false}],"days":[{"date":"2026-11-03","shift":"D"},{"date":"2026-11-04","shift":"D","start":"08:00","end":"16:00"}]}

Regler:
- "shifts" er de forskellige vagttyper i planen. "ab" er en kort forkortelse på højst 10 tegn og skal være unik. "start" og "end" er 24-timers tid (HH:MM). Slutter vagten efter midnat, er "end" tidligere end "start".
- "oncall": "" for almindelig tjeneste, "on" for rådighedsvagt på tjenestestedet og "off" for vagt uden for tjenestestedet (hjemmevagt eller bagvagt). Ved "off" kan du tilføje "effH" med antal effektive arbejdstimer, hvis det fremgår.
- "leave": true for ferie, afspadsering og andet fravær, ellers false.
- "days" har én post pr. dato med en vagt. "date" er den dato, vagten starter, skrevet ÅÅÅÅ-MM-DD. "shift" er "ab" fra "shifts". Afviger en enkelt dag fra vagttypens tider, så tilføj "start" og "end" på dagen.
- Fridage udelades.
- Min planlægger kan kun have én vagt pr. dag. Har jeg flere vagter samme dag, så skriv kun den første i JSON og nævn de udeladte i en kort linje efter kodeblokken.
- Gæt ikke. Er år, tider eller en forkortelses betydning uklar, så spørg mig først.

Her er min vagtplan:
[indsæt din vagtplan her som tekst, tabel eller billede]`;

 sk:{rev:'Løn kontrolleret mod regionernes lønark pr. 1.4.2026 (Region Syddanmark), ulempesatser og overarbejde bekræftet i arbejdstidsaftalen (19.10.2026). Ikke afstemt mod lønseddel',docs:[['Region Syddanmark: Sundhedskartellet, overenskomst 32.17.1, løn pr. 1.4.2026 (bl.a. bioanalytikere)','https://regionsyddanmark.dk/media/lknb5bwn/sundhedskartellet-overenskomst-32-17-1-l%C3%B8n-pr-1-4-2026.pdf'],['DSR: løn og overenskomst, regionalt ansatte (lønvejledning og OK-tekster)','https://dsr.dk/loen-og-arbejdsvilkaar/ansat-i-det-regionale/se-ok-og-loen-regionalt-ansatte/'],['DSR lønvejledning, regioner og kommuner (pdf)','https://dsr.dk/media/xzelhuxc/26-64-loenvejledning_regpluskom.pdf'],['OK24 for ikke-ledende personale på Sundhedskartellets område (RLTN)','']],
  refs:{løn:'DSR lønvejledning (løntabeller pr. område og anciennitet) og OK § 4–5',ul:'Arbejdstidsaftalen § 12 stk. 3: aften 18–23 32 %, nat 23–06 37,5 %, lørdag 06–søndag 24 47 %, helligdage 50 %',ot:'Arbejdstidsaftalen § 13 stk. 3: 50 % eller afspadsering 1:1,5',pen:'OK § 10: 14 % (sygeplejersker og radiografer)',hvile:'Fridøgn § 7, hviletid 11 timer (OK 11.10.10), 35 timers fridøgnsperiode',rt:'Sygdom § 16 stk. 1, barns 1. og 2. sygedag § 17, tjenestefrihed § 20'},
  open:['Bioanalytikere: trin 4 med 12.838 kr. de første 8 år, trin 6 derefter, 25.370 kr. fra 10 år (OK § 5 stk. 14–15), pension 13,66 %. Kontrolleret mod Region Syddanmarks tabel pr. 1.4.2026 i område 1 (30.062, 33.298 og 35.831 kr.). Geografisk adskilte institutioner (7,5 %) og bioanalytikerundervisere er ikke med.','Ergo-/fysioterapeuter og jordemødre har deres eget lønforløb under overenskomst 33.21.1 (se OK-kortet for dem).','Rådighedsvagt, delt og omlagt tjeneste og lokalaftaler er ikke med.','Satserne er pr. 1.10.2026 efter DSR; tjek at området passer til din kommune.']},
 efj:{rev:'Gennemgået mod regionernes lønsatser pr. 1.4.2026 og Danske Fysioterapeuters lønark, 19.10.2026. Ikke afstemt mod lønseddel',docs:[['Region Syddanmark: Ergo, fysio, jordemødre, overenskomst 33.21.1, løn pr. 1.4.2026','https://regionsyddanmark.dk/media/ldgekvi4/ergo-fysio-jord%C3%B8m%C3%B8dre-overenskomst-33-21-1-l%C3%B8n-pr-1-4-2026.pdf'],['Region Nordjylland: 33.21.1 løn april 2026 (samme tabeller)','https://rn.dk/-/media/Rn_dk/Om-Region-Nordjylland/Regionen-som-arbejdsplads/Loengennemsigtighed/Sundhedspersonale/33321-Ergo-fys-jordemoedre_2026-april.pdf'],['Danske Fysioterapeuter: regionale lønsatser pr. 1.4.2026','https://www.fysio.dk/globalassets/documents/raadgivning/loen/regionale-lonsatser-pr.-1.-april-2026.pdf'],['Danske Fysioterapeuter: job og vilkår 1.10.2025 (regionale ulempeydelser)','https://www.fysio.dk/globalassets/documents/raadgivning/arbejdsvilkaar/jv-01.10.2025.pdf'],['Aftale om lønninger for ansatte i regionerne (OK 21.03.1): områdetillæg og kommuner','https://laeger.dk/media/ofqnztxr/aftale-om-loenninger-for-ansatte-i-regionerne.pdf']],
  refs:{løn:'Regionernes lønark 33.21.1 og fysio.dk pr. 1.4.2026 (område 1–4), omregnet til 1.10.2026 med 1,20463/1,198008. Appens tal er udledt af DSR-tabellerne plus tillæggene og stemmer med de offentliggjorte tal inden for 0,5 kr. pr. måned',ul:'Danske Fysioterapeuter, job og vilkår: aften 18–23 32 %, nat 23–06 37,5 %, lørdag 06 til søndag 24 47 % (1. maj og nytårsaften fra 12), helligdage 50 %',ot:'50 % eller afspadsering (antaget som Sundhedskartellets aftale; 33.21.3 er ikke åbnet)',pen:'Ergo/fysio 18,75 % (heri 3,75 % fritvalg), jordemødre 16,41 %, kandidater 20,57 %. Egen andel 1/3 er antaget',hvile:'Antaget som Sundhedskartellet: 11 timers hvile og 35 timers frihed',rt:'Generel tekst uden paragraffer (33.21.1 er ikke åbnet i fuld tekst)'},
  open:['Arbejdstidsaftalen 33.21.3 har jeg ikke kunnet åbne. Overarbejde, hvile, fridøgn og normperiode (14 uger) er antaget som i Sundhedskartellets aftale. Ulempesatserne er bekræftet for fysioterapeuter og antaget ens for ergoterapeuter og jordemødre.','Egen andel af pensionen (1/3) er antaget som i de øvrige Sundhedskartel-overenskomster.','Trin 7-forløbet (35.214 kr. i område 1 pr. 1.4.2026) er hentet fra regionernes tabel, hvor overskriften ikke var læsbar. Tjek mod ansættelsesbrevet.','En tabel med trin 5 i starten (til og med 4 år, derefter trin 6) står i regionernes lønark uden læsbar overskrift og er ikke lagt ind. Det samme gælder kliniske undervisere og uddannelsesansvarlige jordemødre.','Område 0 og 1 er slået sammen i regionerne fra 1.7.2026; kommunelisten er fra OK 21.03.1.','Lokalaftaler, fødetillæg og særlig feriegodtgørelse er ikke med.']},
 sosu:{rev:'Løn kontrolleret mod regionernes lønark pr. 1.4.2026 (19.10.2026). Ulempesatser fra FOA lønmagasin. Ikke afstemt mod lønseddel',docs:[['Region Syddanmark: social- og sundhedspersonale, overenskomst 32.03.1, løn pr. 1.4.2026','https://regionsyddanmark.dk/media/5hrngu3v/social-og-sundhedspersonale-overenskomst-32-03-1-l%C3%B8n-pr-1-4-2026.pdf'],['OK 32.03.1, social- og sundhedspersonale (OK24, okportal)','https://okportal.dk/media/vjvpg0qb/32031.pdf'],['Aftale om lønninger for ansatte i regionerne (21.03.1), løntrin','https://www.okportal.dk/media/tpgfuzpv/21031.pdf'],['FOA lønmagasin for regionalt ansatte (foa.dk, åbn selv)','https://www.foa.dk']],
  refs:{løn:'OK 32.03.1 § 5–6 (grundløn efter løntrin, f.eks. SSA 22) og FOA lønmagasin',ul:'FOA lønmagasin / arbejdstidsaftalen: aften, nat, weekend og helligdage i procent',pen:'13,2 % (SSA, SSH), 12,6 % (sundhedsmedhjælper), 13,4 % (portør), 13,53 % (serviceassistent)',hvile:'Arbejdstidsaftalen og hviletidsaftalen',rt:'Se fanen Rettigheder'},
  open:['Delt tjeneste, omlagt tjeneste, rådighedsvagt og lokalaftaler er ikke med.','Kommunal ansættelse (KL) er ikke med; den har andre satser.','Ulempesatserne (aften 17–23 34 %, nat 37,5 %, weekend 47 %, helligdage 50 %) er fra FOA\'s lønmagasin, som jeg ikke kan åbne igen (foa.dk afviser maskiner). I en tekst har jeg kun kunnet læse 2011-udgaven af arbejdstidsaftalen (29 %, 32,5 %, 42 %, 50 %); at de nuværende satser er 5 procentpoint højere er ikke dokumenteret i en tekst. Tjek mod arbejdstidsaftalen OK 11.05.11.1.','Funktionstillæggene (plejehjem, lukkede, retspsykiatriske, medicinske afsnit) er fra regionernes lønark. Øvrige centrale tillæg, fx for operationsteknikere og sygehjælpere, er ikke med.']},
 por:{rev:'Løn kontrolleret mod regionernes lønark pr. 1.4.2026 (19.10.2026). Ulempesatser fra FOA lønmagasin. Ikke afstemt mod lønseddel',docs:[['Region Syddanmark: sygehusportører, overenskomst 32.16.1, løn pr. 1.4.2026','https://regionsyddanmark.dk/media/s2clm05r/sygehusport%C3%B8rer-overenskomst-32-16-1-l%C3%B8n-pr-1-4-2026.pdf'],['OK 32.16.1, sygehusportører (OK24, okportal)','https://www.okportal.dk/media/v21a1rqo/32161.pdf'],['FOA lønmagasin (foa.dk, åbn selv)','https://www.foa.dk']],refs:{løn:'OK 32.16.1 og lønmagasin: garantiløn efter 3 og 10 år',ul:'Som for SOSU: aften 17–23, nat 23–06, weekend, helligdage i procent',pen:'13,4 %',rt:'Se fanen Rettigheder'},open:['Delt tjeneste, rådighedsvagt, sektionsarbejde og lokale tillæg er ikke med.','Ulempesatserne (aften 17–23 34 %, nat 37,5 %, weekend 47 %, helligdage 50 %) er fra FOA\'s lønmagasin og ikke kontrolleret mod arbejdstidsaftalen OK 11.05.11.1.','Løntabellen i regionernes lønark har tre blokke (trin 15/17/23, 16/18/24 og 24/26/32). Appen bruger den første; portører på trin 16 eller 24 indtaster månedsløn selv.']},
 hk:{rev:'Løn kontrolleret mod regionernes lønark pr. 1.4.2026 og lønskalaen pr. 1.7.2026 (19.10.2026). Ulempe antaget som FOA. Ikke afstemt mod lønseddel',docs:[['Region Syddanmark: sundhedsadministrativt personale, overenskomst 32.09.1, løn pr. 1.4.2026','https://regionsyddanmark.dk/media/m2qngjna/sundhedsadministrativt-personale-overenskomst-32-09-1-l%C3%B8n-pr-1-4-2026.pdf'],['Region Nordjylland: 33.20.9 sundhedsadministrativt personale, april 2026','https://rn.dk/-/media/Rn_dk/Om-Region-Nordjylland/Regionen-som-arbejdsplads/Loengennemsigtighed/Administrative-sundhedsadministrative-medarbejdere/33209-Sundhedsadministrativt-personale_2026-april.pdf'],['Regionale lønninger pr. 1.7.2026 (trin 1–55, gruppe 1–4)','https://sl.dk/media/pu3d5oyh/1-juli-2026-regionale-loenninger.pdf'],['FOA: kommenteret arbejdstidsaftale, Danske Regioner (OK 2011, kun til sammenligning)','https://www.foa.dk/~/media/faelles/pdf/overenskomster/ok-2011/kost-service/kommenteretarbejdstidsaftaledr.pdf']],
  refs:{løn:'Lønarket 32.09.1: trin 14/21 (+1.400), 20/26 (+3.495), 24/30 (+1.602), 29/31; månedsløn = lønskala (gruppe 1–4) + tillæg × 1,198008, omregnet til 1.10.2026',ul:'Antaget som FOA/HK-arbejdstidsaftalen OK 11.05.11.1: aften 17–23 34 %, nat 23–06 37,5 %, weekend 47 %, helligdage 50 %',ot:'50 % eller afspadsering',pen:'16,15 % (lønarket), 1/3 egen andel er antaget',hvile:'Som FOA: 11 timers hvile, 35 timers frihed',rt:'Generel tekst uden paragraffer'},
  open:['Lønarket viser tre titler (sundhedsservicesekretær, lægesekretær, ikke-uddannet lægesekretær) og fire trinforløb, men tydeliggør ikke, hvilken titel der hører til hvilket forløb. Derfor vælger brugeren efter startløntrin.','Ulempesatserne er antaget som hos FOA. I 2011-teksten havde lægesekretærer et højere nattillæg (34,5 % mod 32,5 %); den nuværende sats har jeg ikke kunnet læse.','Selve arbejdstidsaftalen (OK 11.05.11.1) kunne jeg ikke åbne i den nuværende udgave.','Egen andel af pensionen (1/3) og pension af aften-/nattillæg (12,6 %) er antaget.','Lægesekretærelever, koordinatorer, ledere og specialister er ikke lagt ind (indtast månedsløn).','Område 2–4 er udledt af lønskalaen; lønarket viser kun område 1.']},
 sped:{rev:'Løn kontrolleret mod regionernes lønskala og Socialpædagogernes lønoversigt (19.10.2026). Ulempebeløb ikke kontrolleret. Ikke afstemt mod lønseddel',docs:[['Socialpædagogerne: lønoversigt regioner 2026–2029 (trin 27/30/34 med tillæg, pension)','https://sl.dk/media/i2dng3xy/regioner-loenoversigt-2026-2029.pdf'],['Regionale lønninger pr. 1.7.2026 (trin 1–55, gruppe 1–4)','https://sl.dk/media/pu3d5oyh/1-juli-2026-regionale-loenninger.pdf'],['Regionale lønninger pr. 1.4.2026','https://sl.dk/media/qq0gjjs4/1-april-2026-regioner-loenninger.pdf'],['Arbejdstidsaftale for pædagogisk personale ved døgninstitutioner m.v. (OK-18, 11.05.4.1)','https://regionsyddanmark.dk/media/wlbho4nr/arbejdstidaftale-p%C3%A6d.pdf'],['Forhandlingsprotokol socialpædagogisk personale (OK24)','https://www.regioner.dk/media/ikami1cf/forhandlingsprotokol-socialpaedagogisk-personale.pdf']],
  refs:{løn:'Trin 27 (+ 23.068 kr.), trin 30 (+ 23.068) efter 6 år og trin 34 (+ 32.788) efter 10 år, 2018-niveau × 1,198008 pr. 1.4.2026, gruppe 1–4 fra lønskalaen; omregnet til 1.10.2026 med 1,20463/1,198008',ul:'Arbejdstidsaftalen 11.05.4.1: tjeneste 17–06 (§ 11 stk. 8), lørdag 08–24 og mandag 00–04 (§ 11 stk. 5), mandag 04–06 som lørdag hvis tjenesten er begyndt senest kl. 00 (§ 11 stk. 6), søn- og helligdage 50 % (§ 11 stk. 4), juleaften fra dagtjenestens start, 1. maj og nytårsaften fra kl. 12 som søndag (§ 4 stk. 10, § 9)',ot:'50 % eller afspadsering 1:1,5 (§ 12 stk. 3)',pen:'15,0 % (15,1 % fra 1.4.2027), 1/3 egen andel',hvile:'35 timers fridøgn, 11 timers hvile',rt:'Generel tekst uden paragraffer'},
  open:['Ulempebeløbene i appen (17–06 35,94 kr. og lørdag 40,17 kr. pr. 1.4.2026) er fra en ældre lønoversigt. OK-18-teksten har 25,00 og 30,03 kr. i 2018-niveau, som svarer til 29,95 og 35,98 kr. pr. 1.4.2026. Forskellen er ikke forklaret; OK24-protokollen ændrer ikke satserne. Tjek mod din lønseddel.','Lørdagstillægget gælder i appen fra kl. 8 (OK-18 § 11 stk. 5); før blev kl. 6 brugt. Om lørdag 17–24 også udløser 17–06-tillægget er ikke afklaret; appen giver kun lørdagssatsen.','Juleaften regnes fra kl. 7 (dagtjenestens start er et skøn), og 1. maj og nytårsaften som søndag. Grundlovsdag kan erstatte 1. maj lokalt og er ikke med.','Vagttillæg (7.631 kr.) og tillæg for lukkede afdelinger (14.010 og 6.602 kr.) er fra en tidligere udgave og er ikke kontrolleret.','Fra 1.4.2027 stiger grundlønstillægget med 5.475 kr. (2018-niveau), 15 år giver trin 34 + 36.588, og pensionen bliver 15,1 %. Det er ikke lagt ind.','Pension af tillæg for tjeneste 17–06 (6,42 %, § 27) er ikke med.','Delt tjeneste, rådighedsvagt, døgnvagt og kommunal ansættelse (KL) er ikke med.']},
 glpk:{rev:'Bygget på resultatpapiret af 4.8.2025 (den endelige tekst mangler), ikke afstemt',docs:[['Resultatpapir PK/PPK, Grønland, 4. august 2025 (uploadet/hentet tidligere)','']],refs:{løn:'Lønskala trin 1–28 i resultatpapiret',ul:'Aften og nat i procent, weekend og helligdage i kroner',pen:'Se profilens pensionstekst',rt:'Se fanen Rettigheder'},open:['Den endelige overenskomsttekst findes ikke endnu.','Rådighedsvagt, vagt fra hjemmet og seniordage er ikke med.','21. juni (Grønlands nationaldag) er lagt ind som helligdag. Jeg har ikke fundet en kilde, der viser, at overenskomsten sidestiller den med søn- og helligdage. Tjek mod din lønseddel.']},
 spv:{rev:'Bygget på FADL\'s vagtvilkår, gennemgået 19.10.2026. Ikke afstemt mod lønseddel',docs:[['FADL: vagtvilkår for SPV og ventilatør','https://www.fadl.dk'],['FADL vagtbooking','https://booking.fadlvagt.dk'],['OK 33.05.1 (lægevikar) til sammenligning','https://okportal.dk/media/2afjc3uy/33051.pdf']],refs:{løn:'FADL: timeløn pr. region (Hovedstaden/Sjælland 180,97 kr., øvrige 177,67 kr.), SPV senior 177,67, ventilatør 188,67 pr. 1.10.2026',ul:'Aften/nat 17–06 55,89 kr., ekstra nat 23–06 18,07 kr., lørdag 51,18 kr., søndage 50 %, helligdage 100 % (lagt oven i hinanden)',pen:'6,4 % (1/3 egen andel)',rt:'Se fanen Rettigheder'},open:['Om 17–06-tillægget lægges oven i lørdags-/søndags-/helligdagstillæg er et skøn (lagt oven i hinanden).','1. maj og grundlovsdag er regnet fra kl. 00 (kan være fra kl. 12).','Overarbejde, rådighedsvagt, 200 % efter 6 dage i træk og lokalaftaler er ikke med.']},
 lvik:{rev:'Bygget på OK 33.05.1, gennemgået 19.10.2026. Ikke afstemt mod lønseddel',docs:[['OK 33.05.1, lægevikar (OK24, okportal)','https://okportal.dk/media/2afjc3uy/33051.pdf']],refs:{løn:'OK 33.05.1: grundløn 310.983 + særligt tillæg 22.312 (2018-niveau) × regulering',ul:'Ulempetillæg som for yngre læger (samme satser)',pen:'5,63 % (1/3 egen andel)',rt:'Se fanen Rettigheder'},open:['Om det særlige tillæg (22.312) indgår i timelønnen er et skøn.','Overarbejde, ekstraordinære tilkald, holdtjeneste og decentral løn er ikke med.']},
 amb:{rev:'Gennemgået mod overenskomstteksten og protokollen 19.10.2026. Ikke afstemt mod lønseddel',docs:[['OK-18 overenskomst 32.44.1 for ambulanceuddannet personale (grundtekst: § 5 løn, § 7 kvalifikationsløn, § 9 pension)','https://okportal.dk/media/17241/4866.pdf'],['Forhandlingsprotokol F32.44.1 (5.3.2024, tillæg 7.2.2025) med bilag 3 arbejdstidsaftale','https://regioner.dk/media/3jqohl2c/f32441.pdf'],['Aftale om lønninger for ansatte i regionerne (21.03.1), bilag 6A s. 21','https://www.okportal.dk/media/tpgfuzpv/21031.pdf'],['FOA: OK24 ambulanceuddannet personale (åbn selv; foa.dk afviser maskiner)','https://www.foa.dk/~/media/okpdffiles/ok24-1561%20overenskomst%20for%20ambulanceuddannet%20personale%20pdf.pdf']],
  refs:{løn:'Protokol pkt. 2.1: ambulancebehandler trin 24 + 7.250, paramediciner trin 24 + 22.000, ST-redder trin 20 (2018-niveau); trinbeløb i 21.03.1 bilag 6A; kvalifikationsløn OK § 7 stk. 2 (OK-18-tekst)',ul:'Protokollen: forskudttidstillæg 35,49 kr. og weekendtillæg 60,32 kr. pr. time (2018-niveau); tidsrum i bilag 3 § 6',ot:'Bilag 3 § 7: 50 % de første 3 timer, derefter 100 % (appen regner kun 50 %)',pen:'OK § 9 stk. 1: 14,0 %, 1/3 egen andel',hvile:'Bilag 3 § 10: 35 timers frihedsperiode, § 9: hviletidsaftale (11 timer)',rt:'Sygdom § 3 (funktionærloven), barns sygedag § 13, tjenestefrihed § 14'},
  open:['OK24-udgaven af selve overenskomsten (efter OK-18) har jeg ikke kunnet åbne; § 7 (4 og 10 år) og § 9 er fra OK-18-teksten. Tjek mod den nuværende.','Om forskudttids- og weekendtillæg er pensionsgivende fremgår ikke (appen regner dem som ikke pensionsgivende).','Mandag 04–06: weekendtillæg regnes, hvis tjenesten er begyndt senest kl. 00, ellers forskudttidstillæg.','Døgnvagter (20 timer tæller), kronetillæg for døgnvagt (390), rådighedsvagt og ulempegodtgørelse (3 timers frihed pr. 37 timer 19–07) er ikke med.','Elevpension er ikke lagt ind.','Fra 1.4.2027: løntrin +1, ulempesatser ca. +8 %, pension 15 % (OK26).']},

function npsPanel(e,r){if(!NPS)return'';const k=npKeys(e),T=n=>String(Math.round(n*100)/100).replace('.',','),ln=n=>Math.floor(n/7)+' uger'+(n%7?' + '+n%7+' d':'');

   return`<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><span class="sp"><b>${dd(x.from)} – ${dd(x.to)}</b>${x.mine?' <span class="tag">Din deling</span>':''}<br><span class="note" style="margin:0">${ln(pDaysOf(x.from,x.to))} · ${T(x.hrs)} t/uge${x.vt?' · '+esc(VT[x.vt]||''):''}<br>${npMeta(x)}</span></span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${act}</span></div></div>`};

  ${ps.map(p=>{const m=npFind(e,p);return m?`<div style="margin-top:6px;color:var(--ink)">✓ ${dd(p.from)} – ${dd(pEnd(p))} · ${T(+p.hrs||R().weekHours)} t/uge <span class="note" style="margin:0">· delt ${npDay(m.at)}</span></div>`:`<label style="flex-direction:row;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" ${NPS.sel[p.id]?'checked':''} onchange="npsTog('${p.id}')">${dd(p.from)} – ${dd(pEnd(p))} · ${T(+p.hrs||R().weekHours)} t/uge <span class="note" style="margin:0">· ikke delt</span></label>`}).join('')}

const sfSig=x=>npNorm(x.name||x.ab)+'|'+(x.t||[]).slice(0,1).map(a=>(a[0]||'')+(a[1]||'')).join('');
function sfPack(s){return{n:String(s.name||'').slice(0,60),a:String(s.ab||'').slice(0,8),c:s.color,b:s.byDay?1:0,t:(s.t||[]).slice(0,7).map(a=>[a[0]||'',a[1]||'',a[2]?1:0]),o:s.oncall||'',l:s.leave?1:0}}
function sfClean(p){try{const tm=v=>/^\d\d:\d\d$/.test(v)||v==='';if(!p||!Array.isArray(p.t)||p.t.length!==7)return null;const t=p.t.map(a=>{if(!Array.isArray(a)||!tm(a[0])||!tm(a[1]))throw 0;const r=[a[0],a[1]];if(a[2])r.push(true);return r});
 const n=String(p.n||'').slice(0,60),a=String(p.a||'').slice(0,8);if(!n&&!a)return null;if(!t.some(x=>x[0]&&x[1]))return null;

async function sfFetch(){const e=emp();if(!e||!sfOk())return;const dk=npKeys(e).dk;if(SFC[dk]!==undefined)return;SFC[dk]=null;
 const js=[await api('sf_list',{dk})];for(const d2 of npAltDks(e))js.push(await api('sf_list',{dk:d2}));const seenJ={},its=[];for(const jj of js)for(const x of (jj.items||[])){const o=seenJ[x.j];if(o){o.n=(o.n||0)+(x.n||0);o.mine=o.mine||x.mine;continue}seenJ[x.j]=x;its.push(x)}const j={items:its};SFC[dk]=(j.items||[]).map(x=>{let p=null;try{p=sfClean(JSON.parse(x.j))}catch(_){}return p&&Object.assign(p,{n:x.n,id:x.id,at:x.at,mine:x.mine})}).filter(Boolean);render()}

function sfTog(id){SFS.sel[id]=!SFS.sel[id];render()}
function sfAddAll(idx){const m=sfMissing();let n=0;for(const i of idx){const x=m[i];if(x){shifts().push(Object.assign({id:uid()},{name:x.name,ab:x.ab,color:x.color,byDay:x.byDay,t:JSON.parse(JSON.stringify(x.t)),oncall:x.oncall,leave:x.leave}));api('sf_use',{id:x.id}).catch(()=>{});n++}}if(n){save();if(idx.length>1)tell(n+' vagtformer er lagt ind.')}render()}
function sfUnshare(id){const e=emp();ask('Fjern delingen helt? Den forsvinder med det samme for alle kolleger. Du kan dele den igen bagefter.',async()=>{const j=await api('sf_unshare',{ids:[id]});if(j.ok){await sfMineLoad(e);delete SFC[npKeys(e).dk];shareStats();render();tell('Delingen er fjernet.')}else tell(j.error||'Kunne ikke fjerne delingen.')})}
function sfRow(x,right){const t=x.byDay?dayGroups(x).map(g=>g.lab+' '+tt(g.t)).join(', '):tt(x.t[0])+' · '+fmt(dur(x.t[0]));return`<div class="lg nn" style="--c:${x.color};margin:6px 0"><span class="lgt"><b>${esc(x.name||x.ab)}</b><span>${t}${x.leave?' · fravær':''}</span><span>${x.at?npMeta(x):''}</span></span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${right}</span></div>`}
function sfPanel(m){const wrap=(h,b)=>`<div style="margin-top:12px;padding:14px;border:1px solid var(--acc);border-radius:12px;background:var(--bg)"><div class="row" style="margin-bottom:6px"><b class="sp">${h}</b><button class="b" style="padding:2px 10px;font-size:12px" onclick="sfClose()">Luk</button></div>${b}</div>`;
 if(SFS.mode==='get'){if(SFC[npKeys(emp()).dk]==null)return wrap('Vagtformer fra kolleger','<p class="note">Henter ...</p>');
  return wrap('Vagtformer fra kolleger',m.length?`<p class="note" style="margin:0 0 6px">Kun vagtformer fra samme afdeling vises. Tiderne kan du rette bagefter.</p>`+m.map((x,i)=>sfRow(x,`<button class="b p" style="padding:3px 10px;font-size:12.5px" onclick="sfAddAll([${i}])">Tilføj</button>`)).join('')+(m.length>1?`<div class="row" style="margin-top:8px"><button class="b p" onclick="sfAddAll([${m.map((_,i)=>i).join(',')}])">Tilføj alle</button></div>`:''):'<p class="note">Der er ingen nye vagtformer fra kolleger på denne afdeling endnu.</p>')}
 const sh=shifts(),ms=sfMine(emp()),st=AUTH.ss;
 const mineH=ms.length?`<div style="margin:6px 0 10px"><b style="font-size:14px">Dine delinger</b>${ms.map(x=>{const p=sfClean(JSON.parse(x.j));return p?sfRow(Object.assign(p,{at:x.at,n:x.n}),`<button class="b d" style="padding:3px 10px;font-size:12.5px" onclick="sfUnshare('${x.id}')">Træk tilbage</button>`)+`<div class="note" style="margin:-2px 0 4px">Brugt af ${x.used} ${x.used===1?'kollega':'kolleger'}</div>`:''}).join('')}<p class="note" style="margin:6px 0 0">Har du delt noget forkert, så tryk Træk tilbage. Så forsvinder det med det samme for alle. Sletter du vagtformen i din egen liste, fjernes delingen også.</p></div>`:'';
 return wrap('Del mine vagtformer',(st&&st.name?`<p class="note" style="margin:0 0 8px">Din status: <b>${shareBadge(st)}</b></p>`:'')+mineH+(sh.length?sh.map(s=>{const m2=sfFindMine(emp(),s);return m2?`<div style="margin-top:6px;color:var(--ink)">✓ ${esc(s.name||s.ab)} <span class="note" style="margin:0">· delt ${npDay(m2.at)}</span></div>`:`<label style="flex-direction:row;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" ${SFS.sel[s.id]?'checked':''} onchange="sfTog('${s.id}')">${esc(s.name||s.ab)} <span class="note">${s.byDay?dayGroups(s).map(g=>g.lab+' '+tt(g.t)).join(', '):tt(s.t[0])} · ikke delt</span></label>`}).join('')+`<p class="note">Det, der deles: afdeling, navn, tider, farve og type. Andre kan se, hvornår det blev delt, og hvor mange der har den, men aldrig hvem.</p><button class="b p" onclick="sfShare()">Del valgte</button>`:'<p class="note">Du har ingen vagtformer at dele endnu.</p>'))}
async function sfPut(list){const e=emp(),dk=npKeys(e).dk,j=await api('sf_put',{dk,items:list.map(s=>JSON.stringify(sfPack(s)))});if(j.ok){delete SFC[dk];await sfMineLoad(e);return j.n}tell(j.error||'Kunne ikke dele.');return 0}
async function sfShare(){const e=emp(),l=shifts().filter(s=>SFS.sel[s.id]&&!sfFindMine(e,s));if(!l.length){tell('Vælg mindst én vagtform, du ikke allerede har delt.');return}const n=await sfPut(l);if(n){SFS=null;const st=await shareStats();render();tell('Tak! '+n+' vagtformer er delt anonymt.'+(st&&st.name?' Du er '+shareBadge(st)+'.':'')+' Du kan altid trække en deling tilbage.')}}
function sfOffer(s,lead){if(!sfOk())return;ask((lead||'Vil du dele vagtformen "'+(s.name||s.ab)+'" anonymt med kolleger på samme afdeling?')+' Kun navn, tider, farve og type deles. Du kan altid trække den tilbage.',async()=>{const n=await sfPut([s]);if(n){const st=await shareStats();render();tell('Delt. Tak!'+(st&&st.name?' Du er '+shareBadge(st)+'.':''))}},'Ja, del','Nej tak til deling')}
function npOffer(o,lead){if(!sfOk())return;const e=emp(),r=R(),k=npKeys(e);ask((lead||'Vil du dele normperioden '+dd(o.from)+' – '+dd(o.to)+' anonymt med kolleger på samme afdeling og niveau?')+' Kun datoer, ugenorm, vagtlag og vagttype deles. Du kan altid trække den tilbage.',async()=>{const j=await api('np_put',Object.assign({items:[{lag:String(o.lag||'').slice(0,40),from:o.from,to:o.to,hrs:+o.hrs||r.weekHours,vt:o.vt||''}]},k));if(j.ok){delete NPC[k.dk+k.lv];await npMineLoad(e);const st=await shareStats();render();tell('Delt. Tak!'+(st&&st.name?' Du er '+shareBadge(st)+'.':''))}else tell(j.error||'Kunne ikke dele.')},'Ja, del','Nej tak til deling')}
function npSug(){if(!sfOk())return'';const e=emp(),k=npKeys(e),key=k.dk+k.lv;if(NPC[key]===undefined){NPC[key]=null;api('np_list',k).then(j=>{NPC[key]=(j.items||[]).filter(x=>!x.mine&&!periods(e).some(p=>p.from===x.from&&pEnd(p)===x.to));render()});return''}
 const n=(NPC[key]||[]).length;return n?`<div class="row" style="gap:8px;margin:8px 0;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,var(--card))"><span class="sp" style="font-size:13.5px"><b>${n} normperiode${n>1?'r':''}</b> er delt af kolleger på samme afdeling og niveau.</span><button class="b p" onclick="NPE=null;npsOpen('get')">Se dem</button></div>`:''}

/* ===== Hjemmeskærm / webapp ===== */
let INST_EVT=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST_EVT=e;try{render()}catch(x){}});
addEventListener('appinstalled',()=>{INST_EVT=null;try{localStorage.setItem('vp_inst','1')}catch(e){}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isPhone=()=>isIOS()||/Android/i.test(navigator.userAgent);
const instOff=()=>{try{return localStorage.getItem('vp_inst')==='1'}catch(e){return false}};
function instBanner(){if(S.tab!=='work'||!isPhone()||isStandalone()||instOff())return'';
 return`<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="sp" style="min-width:200px"><b>Brug Vagtløn som app</b><div class="note">Læg den på din hjemmeskærm, så åbner den med ét tryk.</div></div><button class="b p" onclick="S.tab='inst';save();render()">Vis hvordan</button><button class="b" onclick="instHide()">Luk</button></div>`}
function instHide(){try{localStorage.setItem('vp_inst','1')}catch(e){}render()}
async function instGo(){if(!INST_EVT)return;INST_EVT.prompt();try{await INST_EVT.userChoice}catch(e){}INST_EVT=null;render()}
function instV(){const ios=isIOS(),and=/Android/i.test(navigator.userAgent),st=isStandalone(),
 box=(t,open,body)=>`<details class="card" ${open?'open':''}><summary><b>${t}</b></summary>${body}</details>`,
 ol=a=>'<ol style="margin:10px 0 0;padding-left:20px;line-height:1.6">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
 return`<h2>Hurtig adgang på telefonen</h2><p class="note">Du kan lægge ${esc(APP)} på din hjemmeskærm. Så får du et ikon som en almindelig app, og siden åbner uden browserens adresselinje.${st?' Du bruger allerede siden som app.':''}</p>
 ${INST_EVT?`<div class="card"><b>Din browser kan installere appen direkte.</b><p style="margin:8px 0 0"><button class="b p" onclick="instGo()">Installér ${esc(APP)}</button></p></div>`:''}
 ${box('iPhone og iPad (Safari)',ios||!and,ol(['Åbn siden i <b>Safari</b>. Åbner du et link fra en anden app, så vælg at åbne det i Safari.','Tryk på <b>Del</b>-knappen (firkanten med en pil op). På iPhone står den nederst, på iPad øverst.','Rul ned i menuen og tryk på <b>Føj til hjemmeskærm</b>.','Tryk på <b>Tilføj</b>. Ikonet ligger nu på din hjemmeskærm.'])+'<p class="note">Bruger du Chrome på iPhone, finder du også Føj til hjemmeskærm under Del-knappen i nyere versioner af iOS.</p>')}
 ${box('Android (Chrome)',and||!ios,ol(['Åbn siden i <b>Chrome</b>.','Tryk på menuen <b>⋮</b> (tre prikker) øverst til højre.','Tryk på <b>Installér app</b> eller <b>Føj til startskærm</b>.','Bekræft med <b>Installér</b> eller <b>Tilføj</b>. Ikonet ligger nu på din startskærm og i din appoversigt.'])+'<p class="note">Bruger du Samsung Internet: Tryk på menuen (tre streger), vælg <b>Tilføj side til</b> og derefter <b>Startskærm</b>.</p>')}
 <div class="card"><h3>Gem dine data med en konto</h3><p class="note" style="margin:0">Log ind, så følger dine data med mellem browseren, appen på hjemmeskærmen og din computer. Uden konto ligger dine data kun i den ene browser. På iPhone er en app på hjemmeskærmen adskilt fra Safari, så data du har lagt ind i Safari, ses ikke i appen, før du logger ind.</p></div>
 <div class="card"><h3>Kalenderfilen</h3><p class="note" style="margin:0">Under Opsætning, Kalenderfil kan du hente dine vagter, så de også står i telefonens kalender.</p></div>`}



S=load();render();authInit();if(typeof authInit==='undefined')rundturBoot();
</script></body></html>
